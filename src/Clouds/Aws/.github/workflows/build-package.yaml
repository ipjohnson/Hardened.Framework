name: build-package

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Authenticate to GitHub Packages
        run: dotnet nuget update source github-ipjohnson-org --username ipjohnson --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --configfile nuget.config
      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore
      - run: dotnet test --configuration Release --no-build
      - run: dotnet pack --configuration Release --no-build /p:PackageVersion=1.0.${{ github.run_number }}
      - run: dotnet nuget push **/bin/Release/*.nupkg --api-key ${{ secrets.GITHUB_TOKEN }} --source "https://nuget.pkg.github.com/ipjohnson-org/index.json" --skip-duplicate
