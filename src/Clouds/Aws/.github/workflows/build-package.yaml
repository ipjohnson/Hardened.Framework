name: build-package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          source-url: https://nuget.pkg.github.com/ipjohnson/index.json
        env:
          NUGET_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore

      - name: Test with coverage
        run: |
          set -o pipefail
          dotnet test \
            --no-build --configuration Release \
            --settings coverlet.runsettings \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage \
            | tee test-output.log

      # xUnit drops test cases that share a unique ID, reporting it only as an
      # informational line. A green run can therefore hide tests that never executed.
      # Treat any such message as a build failure.
      - name: Fail if any test was silently skipped
        run: |
          if grep -q "duplicate ID" test-output.log; then
            echo "::error::Test cases were silently skipped due to duplicate test-case IDs. Give the colliding test methods distinct names."
            grep "duplicate ID" test-output.log
            exit 1
          fi
          echo "No silently skipped tests."

      # Some tests skip themselves rather than fail when what they need is not
      # there - the DynamoDB Local tests skip without a Docker daemon, so that a
      # developer without one gets a stated reason instead of a container timeout.
      # On a runner that is never the right answer: every requirement is present
      # here, so a skip means one stopped being present and the run would go green
      # with fewer tests than it thinks. Nothing may skip in CI.
      - name: Fail if any test skipped
        run: |
          if grep -Eq "Skipped:[[:space:]]*[1-9]" test-output.log; then
            echo "::error::Tests skipped in CI. Everything the suite needs is available on the runner, so a skip means a requirement went missing - not that the test is optional."
            grep -E "Skipped:[[:space:]]*[1-9]" test-output.log
            exit 1
          fi
          echo "Every test ran."

      - name: Coverage summary
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:"coverage/**/*.cobertura.xml" \
            -targetdir:coverage-report \
            -reporttypes:"TextSummary;MarkdownSummaryGithub;Html;JsonSummary"
          cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          cat coverage-report/Summary.txt

      # Coverage was measured and printed on every build and enforced nothing, so it could fall to
      # zero and stay green. This gate holds each assembly at the coverage it already had.
      # Raising a floor is a deliberate act: scripts/coverage-gate.py --update, reviewed and committed.
      - name: Coverage gate
        run: python3 scripts/coverage-gate.py --summary coverage-report/Summary.json

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report

      # GitHub Actions expressions have no arithmetic operators, so the 10000 offset
      # is applied in the shell. The offset keeps the build number at five digits:
      # NuGet compares alphanumeric prerelease labels lexically, so preview9999 would
      # sort above preview10000.
      - name: Pack
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          BUILD=$(( 10000 + GITHUB_RUN_NUMBER ))
          echo "Packing 1.0.0-preview$BUILD"
          dotnet pack --configuration Release --no-build /p:PackageVersion=1.0.0-preview$BUILD

      - name: Push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: dotnet nuget push **/bin/Release/*.nupkg --api-key ${{ secrets.GITHUB_TOKEN }} --source "https://nuget.pkg.github.com/ipjohnson/index.json" --skip-duplicate
