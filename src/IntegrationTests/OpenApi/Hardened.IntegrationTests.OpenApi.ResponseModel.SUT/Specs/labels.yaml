openapi: "3.0.0"
info:
  title: Labels API
  version: "1.0.0"
paths:
  # The trial's blocker shape: a scalar text/plain success beside a JSON error, under the
  # response model. The success case was generated bodyless, so the one response this operation
  # exists to answer went out empty.
  /labels/{labelId}:
    get:
      tags:
        - Label
      operationId: getLabel
      parameters:
        - name: labelId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The label text
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: No such label
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  # The shape the bodyless case exists for. A 204 must stay a case that serializes nothing, so
  # this operation is what guards the fix from over-correcting.
  /labels/{labelId}/archive:
    post:
      tags:
        - Label
      operationId: archiveLabel
      parameters:
        - name: labelId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Archived
        '404':
          description: No such label
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  # A validated body under a contract that declares its validation status. Arm C declared a 422
  # exactly like this, the build published it, and the service answered the stock 400 - the
  # declared status was wired to nothing.
  /labels:
    post:
      tags:
        - Label
      operationId: createLabel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabelRequest'
      responses:
        '200':
          description: The label as stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabelRequest'
        '422':
          description: The label was understood and refused by validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  schemas:
    LabelRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
    Problem:
      type: object
      properties:
        title:
          type: string
        status:
          type: integer
          format: int32
