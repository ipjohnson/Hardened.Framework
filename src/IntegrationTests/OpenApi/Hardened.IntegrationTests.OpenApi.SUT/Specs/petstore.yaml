# This comment is load-bearing. ServedSpecificationTests asserts it reaches the wire, which is
# only true if the document served is this file rather than something emitted from a model of it -
# no OpenAPI model carries comments, so nothing that re-serialises could reproduce this line.
openapi: "3.0.0"
info:
  title: Petstore API
  version: "1.0.0"
paths:
  /pets:
    get:
      tags:
        - Pet
      operationId: listPets
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: A list of pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
    post:
      tags:
        - Pet
      operationId: createPet
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePetRequest'
      responses:
        '201':
          description: Pet created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
  /accounts:
    post:
      tags:
        - Account
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Account'
      responses:
        '200':
          description: The account as stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
  /pets/search:
    get:
      tags:
        - Pet
      operationId: searchPets
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 20
            pattern: "^[a-zA-Z ]+$"
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - available
              - pending
              - sold
      responses:
        '200':
          description: Matching pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
  /pets/{petId}:
    get:
      tags:
        - Pet
      operationId: getPet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A single pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
    put:
      tags:
        - Pet
      operationId: replacePet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePetRequest'
      responses:
        '200':
          description: Pet replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
    patch:
      tags:
        - Pet
      operationId: updatePet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePetRequest'
      responses:
        '200':
          description: Pet updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
    delete:
      tags:
        - Pet
      operationId: deletePet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Pet deleted
  /pets/plain:
    get:
      tags:
        - Pet
      operationId: petsAsPlainText
      responses:
        '200':
          description: The pets, one per line
          content:
            text/plain:
              schema:
                type: string
  /stores:
    get:
      tags:
        - Store
      operationId: listStores
      responses:
        '200':
          description: A list of stores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Store'
components:
  schemas:
    # readOnly and writeOnly, which make one schema describe two directions: the server assigns
    # the id and never accepts one, and the password is accepted and never returned.
    Account:
      type: object
      required:
        - id
        - email
      properties:
        id:
          type: string
          readOnly: true
          description: Assigned by the server.
        email:
          type: string
          maxLength: 100
        password:
          type: string
          writeOnly: true
    Pet:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
        tag:
          type: string
        status:
          type: string
          enum:
            - available
            - pending
            - sold
    CreatePetRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        tag:
          type: string
          maxLength: 50
          pattern: "^[a-zA-Z0-9-]*$"
    UpdatePetRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        rating:
          type: integer
          minimum: 1
          maximum: 5
    Store:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
        location:
          type: string
    PetStatus:
      type: string
      enum:
        - available
        - pending
        - sold
