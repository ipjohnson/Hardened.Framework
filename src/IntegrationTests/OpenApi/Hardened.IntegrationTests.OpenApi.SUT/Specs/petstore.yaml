# This comment is load-bearing. ServedSpecificationTests asserts it reaches the wire, which is
# only true if the document served is this file rather than something emitted from a model of it -
# no OpenAPI model carries comments, so nothing that re-serialises could reproduce this line.
openapi: "3.0.0"
info:
  title: Petstore API
  version: "1.0.0"
# The group's own prose, which used to be parsed to nothing: the published document's tags
# carried the name alone.
tags:
  - name: Pet
    description: Everything about the pets in the store.
paths:
  /pets:
    get:
      tags:
        - Pet
      operationId: listPets
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
        # An array parameter, which the generator types as List<string> and could not bind:
        # the emitter had one scalar Parse call for every source.
        - name: tags
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: A list of pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
    post:
      tags:
        - Pet
      operationId: createPet
      summary: Add a pet to the store
      description: >-
        The prose a description carries, into the document the application publishes.
        This reached the generated C# and stopped there until the handler model carried it.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePetRequest'
      responses:
        '201':
          description: Pet created
          headers:
            Location:
              description: Where the created pet can be read.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
  /accounts:
    post:
      tags:
        - Account
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Account'
      responses:
        '200':
          description: The account as stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
  # Two defects meet on this one operation, and neither is visible in a green build.
  #
  # `species` and `weightGrams` are required members of value types: nothing rejects an enum's first
  # declared member and nothing rejects a zero, so omitting either used to be answered 201 with a
  # value the caller never sent. `lines` carries constraints on its *items*, which were generated,
  # registered in DI, and never called.
  # Two operations whose only job is to be guarded. Kept apart from the routes the validation and
  # enum suites drive: a requirement on one of those turns every test that calls it into an
  # authorization test, which is how the first attempt at this broke fourteen of them.
  /secured/scoped:
    get:
      tags:
        - Secured
      operationId: securedScoped
      security:
        - petstoreOAuth: ["pets:read"]
      responses:
        '200':
          description: Allowed.
          content:
            application/json:
              schema:
                type: string
  # Declared public, and guarded anyway by an [AuthorizeGrants] on the implementation. This is the
  # documented rule in described-authorization.md - "a contract can never widen one" - and nothing
  # was driving it, which is how it came to be reported as broken.
  /guarded/by-attribute:
    get:
      tags:
        - Guarded
      operationId: guardedByAttribute
      security: []
      responses:
        '200':
          description: Allowed.
          content:
            application/json:
              schema:
                type: string
  # An ownership check, which is the decision only the handler can make: the contract says the
  # caller must hold pets:read, and nothing in a document can say "and the row must be theirs".
  # The handler takes ICurrentCaller and compares.
  /secured/owned/{ownerId}:
    get:
      tags:
        - Secured
      operationId: securedOwned
      security:
        - petstoreOAuth: ["pets:read"]
      parameters:
        - name: ownerId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The caller owns it.
          content:
            application/json:
              schema:
                type: string
        '403':
          description: The caller is not the owner.
  /secured/either:
    get:
      tags:
        - Secured
      operationId: securedEither
      security:
        - petstoreOAuth: ["pets:read"]
        - petstoreApiKey: []
      responses:
        '200':
          description: Allowed.
          content:
            application/json:
              schema:
                type: string
  /orders:
    post:
      tags:
        - Order
      operationId: placeOrder
      parameters:
        # A wire name no C# identifier can be. The member becomes IdempotencyKey and the failure
        # has to still name the header the caller sent.
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            pattern: '^[0-9a-f]{8}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
      responses:
        '200':
          description: The order as accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderRequest'
  /pets/search:
    get:
      tags:
        - Pet
      operationId: searchPets
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 20
            pattern: "^[a-zA-Z ]+$"
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - available
              - pending
              - sold
        # A named enum as a query parameter, carrying a value that is not a C# identifier. This is
        # the path that spoke a second vocabulary: the binder parsed the member name, so the
        # document's own "guinea-pig" answered 400 and "GuineaPig" - a name the document never
        # mentions - answered 200.
        - name: species
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/PetSpecies'
        - name: size
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/PetSize'
      responses:
        '200':
          description: Matching pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
  /pets/{petId}:
    get:
      tags:
        - Pet
      operationId: getPet
      parameters:
        - name: petId
          in: path
          required: true
          description: The pet's identifier, as assigned by the server.
          schema:
            type: string
            pattern: '^[a-z0-9-]+$'
      responses:
        '200':
          description: A single pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '404':
          description: No pet with that id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: The caller is being throttled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
    put:
      tags:
        - Pet
      operationId: replacePet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePetRequest'
      responses:
        '200':
          description: Pet replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
    patch:
      tags:
        - Pet
      operationId: updatePet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePetRequest'
      responses:
        '200':
          description: Pet updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
    delete:
      tags:
        - Pet
      operationId: deletePet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Pet deleted
  /pets/names:
    get:
      tags:
        - Pet
      operationId: listPetNames
      responses:
        '200':
          description: Just the names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /pets/plain:
    get:
      tags:
        - Pet
      operationId: petsAsPlainText
      responses:
        '200':
          description: The pets, one per line
          content:
            text/plain:
              schema:
                type: string
  # A scalar text/plain success beside a JSON error. The declared set used to be collected from
  # the 2xx responses alone, so this operation's set was text/plain and nothing else - a set no
  # error model can travel as - and the 404 below, like the framework's own binding 400, reached
  # the caller as an empty 500.
  /pets/{petId}/label:
    get:
      tags:
        - Pet
      operationId: getPetLabel
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
        - name: copies
          in: query
          required: false
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: The pet's cage label, one line per copy
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: No pet with that id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /stores:
    get:
      tags:
        - Store
      operationId: listStores
      security: []
      responses:
        '200':
          description: A list of stores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Store'
components:
  securitySchemes:
    # Carries scopes, so its entries become grants.
    petstoreOAuth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://example.invalid/token
          scopes:
            "pets:read": Read pets.
            "pets:write": Create and change pets.
    # Cannot carry scopes - the specification requires the array to be empty - so an entry naming
    # this one says "be authenticated" and nothing more.
    petstoreApiKey:
      type: apiKey
      name: X-Api-Key
      in: header
  schemas:
    # readOnly and writeOnly, which make one schema describe two directions: the server assigns
    # the id and never accepts one, and the password is accepted and never returned.
    Account:
      type: object
      required:
        - id
        - email
      properties:
        id:
          type: string
          readOnly: true
          description: Assigned by the server.
        email:
          type: string
          maxLength: 100
        password:
          type: string
          writeOnly: true
    Pet:
      description: A pet in the store, as the store knows it.
      type: object
      required:
        - id
        - name
      properties:
        id:
          description: Assigned by the store when the pet is created.
          type: string
        name:
          type: string
        tag:
          type: string
        status:
          type: string
          enum:
            - available
            - pending
            - sold
        species:
          $ref: '#/components/schemas/PetSpecies'
        size:
          $ref: '#/components/schemas/PetSize'
    CreatePetRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        tag:
          type: string
          maxLength: 50
          pattern: "^[a-zA-Z0-9-]*$"
    UpdatePetRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        rating:
          type: integer
          minimum: 1
          maximum: 5
    Store:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
        location:
          type: string
    PetStatus:
      type: string
      enum:
        - available
        - pending
        - sold
    # A value that is not a valid C# identifier. Reachable as a body value and a response value
    # since the generated converter existed; unreachable as a query parameter until the binder
    # stopped calling Enum.Parse on the member name.
    OrderRequest:
      type: object
      required:
        - species
        - weightGrams
        - lines
      properties:
        # An enum, and the reason this one matters: [Required] cannot be emitted against a value
        # type, and nothing else rejects `dog` - the enum's first declared member. An omitted
        # species was stored as a dog and answered 200.
        species:
          $ref: '#/components/schemas/PetSpecies'
        # Deliberately unbounded. A `minimum: 1` here would catch the absence by accident, which is
        # how the integer case stayed hidden while the enum case did not.
        weightGrams:
          type: integer
          format: int32
        lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
    # Constraints one level down from the body, which is where they stopped being run.
    OrderLine:
      type: object
      required:
        - sku
      properties:
        sku:
          type: string
          minLength: 1
        quantity:
          type: integer
          format: int32
          minimum: 1
        # Money, in the two spellings the ecosystem uses, with a bound a double cannot hold
        # exactly. Both reach C# decimal, and the bound goes on the attribute as a string because
        # rendering it through double is what the type exists to avoid.
        unitPrice:
          type: number
          format: decimal
          minimum: 0.01
        discount:
          type: string
          format: number
          minimum: 0.1
    PetSpecies:
      type: string
      enum:
        - dog
        - cat
        - guinea-pig
    # An integer enum. This produced an empty C# enum whose converter threw on every value:
    # ParseSchemaKind recognised the enum, and the member reader dropped everything non-string.
    PetSize:
      type: integer
      format: int32
      enum:
        - 1
        - 5
        - 25
      x-enum-varnames:
        - Small
        - Medium
        - Large
    # RFC 7807. Recognised by its members rather than its name, so a null return can be given a
    # body shaped as the contract says without anything here inventing a domain value.
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        # Declared nullable, which the published document must repeat as the 2020-12 type array.
        # The framework's own 404 body sends detail as null, so a document typing it plain string
        # was describing a payload the service never sends.
        detail:
          type: string
          nullable: true
