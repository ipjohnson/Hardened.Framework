openapi: "3.0.0"
info:
  title: TechEmpower Framework Benchmarks
  version: "1.0.0"
  description: >
    The six TFB test types, described as a spec so the generated pipeline is what serves them.
    Three response shapes are exercised deliberately: application/json, text/plain through the raw
    writer, and text/html through a template.
paths:
  /json:
    get:
      tags:
        - Benchmark
      operationId: jsonSerialization
      responses:
        '200':
          description: A JSON object with a single message field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelloMessage'
  /plaintext:
    get:
      tags:
        - Benchmark
      operationId: plainText
      responses:
        '200':
          description: The literal body "Hello, World!"
          content:
            text/plain:
              schema:
                type: string
  /db:
    get:
      tags:
        - Benchmark
      operationId: singleQuery
      responses:
        '200':
          description: One randomly chosen World row
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/World'
  /queries:
    get:
      tags:
        - Benchmark
      operationId: multipleQueries
      parameters:
        - name: queries
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Between 1 and 500 randomly chosen World rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/World'
  /updates:
    get:
      tags:
        - Benchmark
      operationId: databaseUpdates
      parameters:
        - name: queries
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: The updated World rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/World'
  /fortunes:
    get:
      tags:
        - Benchmark
      operationId: fortunes
      x-hardened-template: Fortunes
      responses:
        '200':
          description: The fortunes table, rendered as HTML
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/FortunePage'
components:
  schemas:
    # Not named Message: a schema whose property matches its own name generates
    # record Message(string Message), which is CS0542. The wire shape is unaffected -
    # TechEmpower specifies the JSON body, and the property is still "message".
    HelloMessage:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    World:
      type: object
      required:
        - id
        - randomNumber
      properties:
        id:
          type: integer
          format: int32
        randomNumber:
          type: integer
          format: int32
    Fortune:
      type: object
      required:
        - id
        - message
      properties:
        id:
          type: integer
          format: int32
        message:
          type: string
    FortunePage:
      type: object
      required:
        - fortunes
      properties:
        fortunes:
          type: array
          items:
            $ref: '#/components/schemas/Fortune'
