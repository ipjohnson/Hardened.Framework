openapi: "3.0.0"
info:
  title: Hardened1 API
  version: "1.0.0"

# The contract. There are no route attributes anywhere in this project - the verb, the path, the
# shapes and the statuses all come from here, and the build turns them into models, a service
# interface, a routing table and the validation the constraints describe.
#
# Every operation declares what it can answer with, not only what it answers when nothing goes
# wrong. That is what a declared response model has to work from: an operation listing one status
# generates one return type however the project is configured.
#if (messagePack)
#
# Each operation declares two representations of its body, and the client's Accept decides between
# them. JSON is listed first, so a client expressing no preference still gets JSON. Nothing in the
# generated C# names a media type: the contract says what an operation produces, and the build
# binds the writer.
#endif
paths:
  /todos/{id}:
    get:
      tags:
        - Todos
      operationId: getTodo
      summary: One todo by id.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
      responses:
        '200':
          description: The todo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
#if (messagePack)
            application/x-msgpack:
              schema:
                $ref: '#/components/schemas/Todo'
#endif
        '404':
          description: No todo has that id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
#if (messagePack)
            application/x-msgpack:
              schema:
                $ref: '#/components/schemas/Problem'
#endif
    delete:
      tags:
        - Todos
      operationId: removeTodo
      summary: Removes a todo.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
      responses:
        # No content, and the generated signature reflects it: the 204 becomes a case
        # carrying nothing rather than a status with no way to answer it.
        '204':
          description: Removed.
        '404':
          description: No todo has that id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
#if (messagePack)
            application/x-msgpack:
              schema:
                $ref: '#/components/schemas/Problem'
#endif
  /todos:
    get:
      tags:
        - Todos
      operationId: listTodos
      summary: Every todo.
      responses:
        '200':
          description: The todos.
          content:
            application/json:
              schema:
                # An array response, so the generated signature is List<Todo> rather than a wrapper
                # type. The only operation here that declares one status, which is why it is the
                # same in every response model.
                type: array
                items:
                  $ref: '#/components/schemas/Todo'
#if (messagePack)
            application/x-msgpack:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Todo'
#endif
    post:
      tags:
        - Todos
      operationId: createTodo
      summary: Creates a todo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewTodo'
#if (messagePack)
          # The request side is not negotiated. A reader is chosen by the inbound Content-Type,
          # whether or not the contract lists the media type - this says so in the document, which
          # is what a generated client reads before it decides what to send.
          application/x-msgpack:
            schema:
              $ref: '#/components/schemas/NewTodo'
#endif
      responses:
        '201':
          description: Created.
          headers:
            Location:
              description: Where the new todo can be read.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
#if (messagePack)
            application/x-msgpack:
              schema:
                $ref: '#/components/schemas/Todo'
#endif
        '409':
          description: A todo with that title already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
#if (messagePack)
            application/x-msgpack:
              schema:
                $ref: '#/components/schemas/Problem'
#endif

components:
#if (messagePackKeyed)
  # x-message-pack-index is what identifies a member on a MessagePack wire, and every member of
  # every schema here states one. Nothing assigns them: an index the build chose would move the
  # next time a property was added above it, and every client generated before the move would read
  # the wrong member with nothing failing. A member with no index is HOAT033 at build, naming the
  # member and the next free index.
  #
  # They are the contract. Renaming title is free; renumbering it is a breaking change, and the
  # document diff that does it reads as an edit to one line.
  #
  # The build publishes each one back into the served document, so a client generated from
  # /openapi.json keys its own models the same way.
#endif
  schemas:
    Todo:
      type: object
      required:
        - id
        - title
        - done
      properties:
        id:
          type: integer
          format: int32
#if (messagePackKeyed)
          x-message-pack-index: 0
#endif
        title:
          type: string
#if (messagePackKeyed)
          x-message-pack-index: 1
#endif
        done:
          type: boolean
#if (messagePackKeyed)
          x-message-pack-index: 2
#endif

    NewTodo:
      type: object
      required:
        - title
      properties:
        title:
          # The constraint is enforced before the handler runs. Nothing in this project validates
          # anything - the build turns this into a filter in front of the generated handler.
          type: string
          minLength: 1
          maxLength: 64
#if (messagePackKeyed)
          x-message-pack-index: 0
#endif

    Problem:
      type: object
      properties:
        type:
          type: string
#if (messagePackKeyed)
          x-message-pack-index: 0
#endif
        title:
          type: string
#if (messagePackKeyed)
          x-message-pack-index: 1
#endif
        status:
          type: integer
          format: int32
#if (messagePackKeyed)
          x-message-pack-index: 2
#endif
        detail:
          type: string
#if (messagePackKeyed)
          x-message-pack-index: 3
#endif
