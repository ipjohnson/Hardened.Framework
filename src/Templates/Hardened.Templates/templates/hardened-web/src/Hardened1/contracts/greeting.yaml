openapi: "3.0.0"
info:
  title: Hardened1 API
  version: "1.0.0"
paths:
  /greeting/{name}:
    get:
      tags:
        - Greeting
      operationId: hello
      summary: Greets someone by name.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
      responses:
        '200':
          description: The greeting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Greeting'
components:
  schemas:
    Greeting:
      type: object
      required:
        - message
      properties:
        message:
          type: string
