name: docs

# Publishes the VitePress site in docs/ to GitHub Pages.
#
# This was ipjohnson-org/Hardened.Docs, a repository of its own, which is why it versioned with
# nothing it documents. The published URL moved with it: /Hardened.Docs/ to /Hardened.Framework/,
# and that repository has to keep a page pointing here because nothing in this one can redirect a
# path it does not serve.
#
# Pages has to be switched on once, by hand: Settings → Pages → Source → GitHub Actions. Until then
# this workflow builds successfully and the deploy step fails, which is the right way round — a
# broken site never replaces a working one.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yaml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and let a newer commit win rather than queueing behind an older one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - run: npm ci

      # A page that spells a version instead of the token is a page a release has to sweep by hand,
      # which is the state .vitepress/version.json exists to end. Caught here, on the pull request
      # that adds one, rather than by release.yaml - whose version step used to be the last in the
      # job and therefore ran after the packages were already on nuget.org.
      #
      # The AWS pages are the exemption. Hardened.Amz stopped at 0.22.0-rc1000 and is being
      # replaced rather than renamed, so its pins name a release that does not move and a token
      # would be wrong for them.
      #
      # Finding nothing is the pass here, unlike the check this replaces: the token is what the
      # pages carry, and its substitution is proven by the build below rather than by a grep.
      - name: Check no page hardcodes a version
        run: |
          set -euo pipefail
          COPYABLE='(Version="|<HardenedVersion>|Hardened\.Templates@)[0-9]+\.[0-9]+\.[0-9]+-rc[0-9]+'

          HARDCODED=$(grep -rnE "$COPYABLE" . --include='*.md' --exclude-dir=design \
                      | grep -v 'Hardened\.Amz\.' || true)

          if [ -n "$HARDCODED" ]; then
            echo "::error::These pages spell a version instead of 0.0.0-HARDENED-VERSION:"
            echo "$HARDCODED"
            exit 1
          fi
          echo "Every documented version comes from .vitepress/version.json."

      # Dead internal links fail the build rather than shipping. The pages cross-reference heavily
      # and a rename would otherwise rot links silently.
      #
      # design/ is excluded from the site by srcExclude in .vitepress/config.ts, so a maintainer
      # note is not a page and a link into one is not checked here.
      - run: npm run build

      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
