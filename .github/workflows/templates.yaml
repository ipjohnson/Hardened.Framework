name: templates

# Its own workflow rather than a job in build-package, because it packs the whole framework to a
# temporary feed and installs the result. That is slow, and it answers a different question:
# build-package asks whether the framework compiles, this asks whether a stranger running
# `dotnet new hardened-web` gets something that builds, tests and serves.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      # Must equal $(HardenedSmithyCliVersion), the same pin build-package enforces.
      SMITHY_VERSION: 1.73.0
      CORE_TOOLS_VERSION: 4.15.1

    steps:
      - uses: actions/checkout@v4

      # Both named explicitly rather than leaning on whatever SDK the runner image ships, which is
      # what "both" used to mean here and moves without notice. 8.0.x is the floor the template
      # pins; the .NET 11 preview is what global.json selects to pack the solution with, and
      # what the net8.0 test assemblies would otherwise have no runtime under.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            11.0.100-preview.7.26381.103

      # The template pins net8.0 and its generated projects must build on the SDK a reader is
      # most likely to have, not only on the newest one. Both are installed so the verification run
      # exercises the floor rather than assuming it.
      - name: Show the SDKs in play
        run: dotnet --list-sdks

      # Verification packs the whole solution, which builds the Smithy fixtures, and the --contract
      # smithy variant compiles a model of its own - so the CLI is needed twice over. The script
      # skips that variant when the pinned version is absent rather than failing, which would
      # quietly reduce what this gate covers; installing it here is what keeps the matrix whole.
      #
      # Cached, checksum-verified, same steps as build-package.
      - name: Cache the Smithy CLI
        id: smithy-cli
        uses: actions/cache@v4
        with:
          path: ~/.smithy-cli
          key: smithy-cli-${{ env.SMITHY_VERSION }}-linux-x86_64

      - name: Install the Smithy CLI
        if: steps.smithy-cli.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          ASSET=smithy-cli-linux-x86_64.zip
          BASE=https://github.com/smithy-lang/smithy/releases/download/$SMITHY_VERSION
          curl -sSLf -o "$ASSET" "$BASE/$ASSET"
          curl -sSLf -o "$ASSET.sha256" "$BASE/$ASSET.sha256"
          echo "$(awk '{print $1}' "$ASSET.sha256")  $ASSET" | sha256sum -c -
          unzip -q "$ASSET"
          mkdir -p ~/.smithy-cli
          mv smithy-cli-linux-x86_64/* ~/.smithy-cli/

      - name: Put the Smithy CLI on PATH
        run: echo "$HOME/.smithy-cli/bin" >> "$GITHUB_PATH"

      - name: Check the Smithy CLI version
        run: |
          set -euo pipefail
          test "$(smithy --version)" = "$SMITHY_VERSION"
          smithy --version

      # The Azure rows run their generated application under the Functions host, which is Azure
      # Functions Core Tools rather than `dotnet run`. The script skips that probe with a printed
      # note when `func` is absent rather than failing, the way it skips the smithy rows; installing
      # the tools here is what keeps the matrix whole.
      #
      # The tools are cached and checksum-verified, the same steps as the Smithy CLI. The npm
      # package fetches the same zip in a single request with no retry. Its install script reports
      # a failed request as `chalk.red is not a function`.
      - name: Cache Azure Functions Core Tools
        id: core-tools
        uses: actions/cache@v4
        with:
          path: ~/.azure-functions-core-tools
          key: azure-functions-core-tools-${{ env.CORE_TOOLS_VERSION }}-linux-x64

      - name: Install Azure Functions Core Tools
        if: steps.core-tools.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          ASSET=Azure.Functions.Cli.linux-x64.$CORE_TOOLS_VERSION.zip
          BASE=https://github.com/Azure/azure-functions-core-tools/releases/download/$CORE_TOOLS_VERSION
          curl -sSLf --retry 5 --retry-all-errors -o "$ASSET" "$BASE/$ASSET"
          curl -sSLf --retry 5 --retry-all-errors -o "$ASSET.sha2" "$BASE/$ASSET.sha2"
          echo "$(cat "$ASSET.sha2")  $ASSET" | sha256sum -c -
          unzip -q "$ASSET" -d ~/.azure-functions-core-tools
          rm "$ASSET"
          chmod +x ~/.azure-functions-core-tools/func \
            ~/.azure-functions-core-tools/in-proc6/func ~/.azure-functions-core-tools/in-proc8/func

      - name: Put Azure Functions Core Tools on PATH
        run: echo "$HOME/.azure-functions-core-tools" >> "$GITHUB_PATH"

      - name: Check the Azure Functions Core Tools version
        run: |
          set -euo pipefail
          test "$(func --version)" = "$CORE_TOOLS_VERSION"
          func --version

      # The generated local.settings.json points the host's own storage at the development
      # account, which is Azurite. The HTTP row indexes without it, but the timer row's schedule
      # monitor and the queue row's host bookkeeping want it, and a host that cannot reach its
      # storage logs errors the probe would have to read past.
      - name: Start Azurite for the Azure rows
        run: |
          set -euo pipefail
          docker run -d --name azurite -p 10000:10000 -p 10001:10001 -p 10002:10002 \
            mcr.microsoft.com/azure-storage/azurite:3.35.0

      # Everything the run needs is in the script, so the workflow is one line and the same
      # command works on a laptop. A CI-only invocation is one nobody can reproduce when it fails.
      - name: Generate, build, test and serve from the packed template
        run: ./scripts/verify-templates.sh
