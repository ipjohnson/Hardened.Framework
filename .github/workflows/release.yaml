name: release

# Cutting a release:
#   git tag v1.0.0 && git push origin v1.0.0
#
# The tag is the single source of truth for the published version. Requires a NUGET_API_KEY
# repository secret with push rights for the Hardened.* package IDs on nuget.org.
#
# This is separate from build-package.yaml, which keeps publishing 1.0.0-preview{10000+run} to
# GitHub Packages on every merge to main. That remains the continuous feed; this is the
# deliberate one, and a version pushed to nuget.org can be unlisted but never removed.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (without the leading v), e.g. 1.0.0'
        required: true

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      # Must equal $(HardenedSmithyCliVersion); the build fails with HSMT011 if it does not.
      SMITHY_VERSION: 1.73.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No source-url, and no NUGET_AUTH_TOKEN. Restore reads src/nuget.config, which is nuget.org
      # and nothing else since ValidationModules was published there at 0.1.0-alpha.1.
      #
      # Pointing setup-dotnet at GitHub Packages writes a nuget.config whose credential is the
      # literal string %NUGET_AUTH_TOKEN%, expanded by NuGet when it restores rather than when the
      # config is written - so the variable has to still be set several steps later, and here it was
      # scoped to this step. An authenticated source that answers 401 is fatal to the whole restore
      # rather than to the packages it serves, so the restore below would have failed on the first
      # tag anyone pushed. build-package.yaml and benchmarks.yaml carried the same arrangement and
      # were fixed the same way.
      #
      # Both push steps are unaffected: each names its feed and key on the command line.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve version
        id: version
        run: |
          # A manual dispatch runs against whatever ref was selected, and that selector remembers
          # the last branch used. Without this, an unreviewed branch could be published to
          # nuget.org, where a version can be unlisted but never removed.
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Releases may only be dispatched from main. This run is on '${GITHUB_REF_NAME}'."
            exit 1
          fi

          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          # Guard against a mistyped tag producing a bad package version.
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$VERSION' is not a valid semantic version"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"

      - run: dotnet restore src/Hardened.Framework.sln

      # Same warnings-as-errors treatment the branch build gets. A release is the last place to
      # relax it.
      # The Smithy CLI turns the .smithy models in the integration fixture into the JSON AST the
      # build task reads. It is pinned, and the build enforces the pin rather than trusting it:
      # $(HardenedSmithyCliVersion) in Hardened.Smithy.SourceGenerator.targets must equal
      # SMITHY_VERSION below, or the build stops with HSMT011 instead of generating against
      # whatever version happens to be installed. Two versions can produce different ASTs, and
      # therefore different generated C#, from identical sources.
      #
      # Cached because the archive is 27 MB and the download is the only slow part; the CLI itself
      # runs once per model edit, not once per build.
      - name: Cache the Smithy CLI
        id: smithy-cli
        uses: actions/cache@v4
        with:
          path: ~/.smithy-cli
          key: smithy-cli-${{ env.SMITHY_VERSION }}-linux-x86_64

      # Verified against the checksum the release publishes beside it. A build that downloads and
      # executes a binary should say which one it expected.
      - name: Install the Smithy CLI
        if: steps.smithy-cli.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          ASSET=smithy-cli-linux-x86_64.zip
          BASE=https://github.com/smithy-lang/smithy/releases/download/$SMITHY_VERSION
          curl -sSLf -o "$ASSET" "$BASE/$ASSET"
          curl -sSLf -o "$ASSET.sha256" "$BASE/$ASSET.sha256"
          echo "$(awk '{print $1}' "$ASSET.sha256")  $ASSET" | sha256sum -c -
          unzip -q "$ASSET"
          mkdir -p ~/.smithy-cli
          mv smithy-cli-linux-x86_64/* ~/.smithy-cli/

      - name: Put the Smithy CLI on PATH
        run: |
          echo "$HOME/.smithy-cli/bin" >> "$GITHUB_PATH"

      # Fails here, naming the version, rather than inside a build task three steps later.
      - name: Check the Smithy CLI version
        run: |
          set -euo pipefail
          test "$(smithy --version)" = "$SMITHY_VERSION"
          smithy --version

      - run: dotnet build src/Hardened.Framework.sln --no-restore --configuration Release -p:ContinuousIntegrationBuild=true

      - name: Test with coverage
        run: |
          set -o pipefail
          dotnet test src/Hardened.Framework.sln \
            --no-build --configuration Release \
            --settings coverlet.runsettings \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage \
            | tee test-output.log

      - name: Fail if any test was silently skipped
        run: |
          if grep -q "duplicate ID" test-output.log; then
            echo "::error::Test cases were silently skipped due to duplicate test-case IDs."
            grep "duplicate ID" test-output.log
            exit 1
          fi
          if grep -Eq "Skipped:[[:space:]]*[1-9]" test-output.log; then
            echo "::error::Tests skipped in CI. A skipped test is one the suite is not running."
            grep -E "Skipped:[[:space:]]*[1-9]" test-output.log
            exit 1
          fi

      - name: Coverage gate
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:"coverage/**/*.cobertura.xml" \
            -targetdir:coverage-report \
            -reporttypes:"TextSummary;MarkdownSummaryGithub;JsonSummary"
          cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/coverage-gate.py --summary coverage-report/Summary.json

      # An explicit list rather than packing the solution. Packing the solution sweeps in whatever
      # is not marked IsPackable=false, which is how Hardened.IntegrationTests.Console.SUT and
      # .OpenApi.SUT ended up on the GitHub feed as packages. On nuget.org a mistake like that
      # claims a public ID permanently.
      #
      # Hardened.DependencyModules.SourceGenerator is deliberately absent. Its generator ships
      # embedded in Hardened.Library.SourceGenerator's analyzers/dotnet/cs, because both projects
      # compile CSharpAuthor in from source and an assembly reference between them collides on
      # CSharpAuthor.TypeExtensions - so a nuspec dependency is not available and embedding is the
      # only mechanism that works. Publishing it standalone as well, as v0.1.0-rc1 did, put the
      # same generator in two packages: a consumer referencing both loaded it twice and both
      # copies emitted the module onto the same partial class, failing with CS0111/CS8646. One
      # publishable supplier is what keeps that impossible.
      # The count check below catches a package removed from the list. It cannot catch one that was
      # never added: it compares against a literal, so a package nobody listed is a package nobody
      # misses. That is how Hardened.Idl.SourceGenerator and Hardened.Smithy.SourceGenerator sat
      # unpublished from #133, and Hardened.Web.StaticContent from #146, while every release since
      # reported success.
      #
      # This asks the other question - is anything packable absent from the list - which is the one
      # that finds a new project rather than a deleted line.
      - name: Verify the pack list covers every packable project
        run: |
          set -euo pipefail

          # Hardened.DependencyModules.SourceGenerator is packable and deliberately unlisted: its
          # generator ships inside Hardened.Library.SourceGenerator's analyzers/dotnet/cs, and
          # publishing it standalone as well - which v0.1.0-rc1 did - puts the same generator in two
          # packages, so a consumer referencing both fails with CS0111/CS8646.
          EXEMPT="Hardened.DependencyModules.SourceGenerator"

          MISSING=""
          while IFS= read -r project; do
            name=$(basename "$project" .csproj)
            case " $EXEMPT " in *" $name "*) continue ;; esac
            grep -qF "$project" .github/workflows/release.yaml || MISSING="$MISSING $name"
          done < <(grep -rl "<IsPackable>[Tt]rue</IsPackable>" --include='*.csproj' src | sort)

          if [ -n "$MISSING" ]; then
            echo "::error::These projects are packable but absent from the pack list:$MISSING"
            exit 1
          fi
          echo "The pack list covers every packable project."

      - name: Pack
        run: |
          for project in \
            src/Requests/Hardened.Requests.Abstract/Hardened.Requests.Abstract.csproj \
            src/Requests/Hardened.Requests.Runtime/Hardened.Requests.Runtime.csproj \
            src/Requests/Hardened.Requests.Testing/Hardened.Requests.Testing.csproj \
            src/Requests/Serializers/Hardened.Requests.Serializers.Newtonsoft/Hardened.Requests.Serializers.Newtonsoft.csproj \
            src/Shared/Hardened.Shared.Runtime/Hardened.Shared.Runtime.csproj \
            src/Shared/Hardened.Shared.Testing/Hardened.Shared.Testing.csproj \
            src/SourceGenerators/Hardened.SourceGenerator/Hardened.SourceGenerator.csproj \
            src/SourceGenerators/Hardened.SourceGeneration.Testing/Hardened.SourceGeneration.Testing.csproj \
            src/SourceGenerators/Hardened.Function.SourceGenerator/Hardened.Function.SourceGenerator.csproj \
            src/SourceGenerators/Hardened.Library.SourceGenerator/Hardened.Library.SourceGenerator.csproj \
            src/SourceGenerators/Hardened.Idl.SourceGenerator/Hardened.Idl.SourceGenerator.csproj \
            src/SourceGenerators/Hardened.OpenApi.SourceGenerator/Hardened.OpenApi.SourceGenerator.csproj \
            src/SourceGenerators/Hardened.Smithy.SourceGenerator/Hardened.Smithy.SourceGenerator.csproj \
            src/SourceGenerators/Hardened.Validation.SourceGenerator/Hardened.Validation.SourceGenerator.csproj \
            src/SourceGenerators/Hardened.Web.SourceGenerator/Hardened.Web.SourceGenerator.csproj \
            src/Web/Hardened.Web.Runtime/Hardened.Web.Runtime.csproj \
            src/Web/Hardened.Web.AspNetCore.Runtime/Hardened.Web.AspNetCore.Runtime.csproj \
            src/Web/Hardened.Web.Kestrel.Runtime/Hardened.Web.Kestrel.Runtime.csproj \
            src/Web/Hardened.Web.StaticContent/Hardened.Web.StaticContent.csproj \
            src/Web/Hardened.Web.Testing/Hardened.Web.Testing.csproj \
            src/Templates/Hardened.Templates.RazorBlade/Hardened.Templates.RazorBlade.csproj; do
            dotnet pack "$project" --configuration Release --no-build --output ./artifacts \
              "/p:PackageVersion=${{ steps.version.outputs.version }}"
          done
          ls -la ./artifacts

      # Checked rather than assumed: a project silently dropped from the list above would
      # otherwise ship a partial release, and the missing package would only surface when a
      # consumer failed to restore it.
      - name: Verify every expected package was produced
        run: |
          # Deliberately a literal rather than derived from the list above. Counting the list
          # would make this agree with itself and check nothing; a number someone has to change
          # is what makes adding a package a two-line edit instead of a silent one.
          #
          # 19 when the list was written. #108 added Hardened.Templates.RazorBlade and
          # Hardened.Validation.SourceGenerator to the pack list and did not update this, which is
          # what this step is for - it failed the v0.1.0-rc1 release before anything was pushed.
          # 20 after Hardened.DependencyModules.SourceGenerator was removed from the list; see the
          # note above the pack step for why it is not published on its own.
          # 18 after Hardened.Commands and Hardened.Console.SourceGenerator were removed - command
          # line parsing shares nothing with the request pipeline and was dropped to shrink the
          # surface area. The 0.4.0-rc1000 packages of both remain on nuget.org and are
          # deliberately left listed.
          # 21 after the three packable projects this list had drifted from were added:
          # Hardened.Idl.SourceGenerator and Hardened.Smithy.SourceGenerator, which arrived in #133
          # and were never listed, and Hardened.Web.StaticContent, which arrived in #146 and was
          # not either. The check above could not catch any of them - it compares the count against
          # this number, so a package nobody added is a package nobody misses.
          EXPECTED=21
          ACTUAL=$(ls -1 ./artifacts/*.nupkg 2>/dev/null | wc -l | tr -d ' ')

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Packed $ACTUAL packages, expected $EXPECTED. Update the list in this workflow if a package was added or removed."
            ls -1 ./artifacts/*.nupkg || true
            exit 1
          fi
          echo "All $EXPECTED packages present."

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: ./artifacts/*

      - name: Push to nuget.org
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            --api-key "${{ secrets.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --source "https://nuget.pkg.github.com/ipjohnson/index.json" \
            --skip-duplicate --no-symbols

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A version carrying a prerelease label must not appear as a stable release.
          case "${{ steps.version.outputs.version }}" in
            *-*) prerelease="--prerelease" ;;
            *)   prerelease="" ;;
          esac

          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            ${prerelease} \
            ./artifacts/*.nupkg
