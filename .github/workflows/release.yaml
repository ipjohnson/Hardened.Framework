name: release

# Cutting a release:
#   git tag v1.0.0 && git push origin v1.0.0
#
# The tag is the single source of truth for the published version. Requires a NUGET_API_KEY
# repository secret with push rights for the Hardened.* package IDs on nuget.org.
#
# This is separate from build-package.yaml, which keeps publishing 1.0.0-preview{10000+run} to
# GitHub Packages on every merge to main. That remains the continuous feed; this is the
# deliberate one, and a version pushed to nuget.org can be unlisted but never removed.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (without the leading v), e.g. 1.0.0'
        required: true

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      # Must equal $(HardenedSmithyCliVersion); the build fails with HSMT011 if it does not.
      SMITHY_VERSION: 1.73.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No source-url, and no NUGET_AUTH_TOKEN. Restore reads nuget.config, which is nuget.org
      # and nothing else since ValidationModules was published there at 0.1.0-alpha.1.
      #
      # Pointing setup-dotnet at GitHub Packages writes a nuget.config whose credential is the
      # literal string %NUGET_AUTH_TOKEN%, expanded by NuGet when it restores rather than when the
      # config is written - so the variable has to still be set several steps later, and here it was
      # scoped to this step. An authenticated source that answers 401 is fatal to the whole restore
      # rather than to the packages it serves, so the restore below would have failed on the first
      # tag anyone pushed. build-package.yaml and benchmarks.yaml carried the same arrangement and
      # were fixed the same way.
      #
      # Both push steps are unaffected: each names its feed and key on the command line.
      #
      # Two SDKs, for the reason build-package.yaml gives at length: global.json selects the .NET 11
      # preview to compile with, and the net8.0 test assemblies need the 8.0 runtime to start. The
      # preview is named exactly, not as 11.0.x - a release is the last place to let the SDK float.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            11.0.100-preview.7.26381.103

      - name: Resolve version
        id: version
        run: |
          # A manual dispatch runs against whatever ref was selected, and that selector remembers
          # the last branch used. Without this, an unreviewed branch could be published to
          # nuget.org, where a version can be unlisted but never removed.
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Releases may only be dispatched from main. This run is on '${GITHUB_REF_NAME}'."
            exit 1
          fi

          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          # Guard against a mistyped tag producing a bad package version.
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$VERSION' is not a valid semantic version"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"

      - run: dotnet restore Hardened.slnx
      - run: dotnet restore Hardened.Simulators.slnx

      # Same warnings-as-errors treatment the branch build gets. A release is the last place to
      # relax it.
      # The Smithy CLI turns the .smithy models in the integration fixture into the JSON AST the
      # build task reads. It is pinned, and the build enforces the pin rather than trusting it:
      # $(HardenedSmithyCliVersion) in Hardened.Smithy.SourceGenerator.targets must equal
      # SMITHY_VERSION below, or the build stops with HSMT011 instead of generating against
      # whatever version happens to be installed. Two versions can produce different ASTs, and
      # therefore different generated C#, from identical sources.
      #
      # Cached because the archive is 27 MB and the download is the only slow part; the CLI itself
      # runs once per model edit, not once per build.
      - name: Cache the Smithy CLI
        id: smithy-cli
        uses: actions/cache@v4
        with:
          path: ~/.smithy-cli
          key: smithy-cli-${{ env.SMITHY_VERSION }}-linux-x86_64

      # Verified against the checksum the release publishes beside it. A build that downloads and
      # executes a binary should say which one it expected.
      - name: Install the Smithy CLI
        if: steps.smithy-cli.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          ASSET=smithy-cli-linux-x86_64.zip
          BASE=https://github.com/smithy-lang/smithy/releases/download/$SMITHY_VERSION
          curl -sSLf -o "$ASSET" "$BASE/$ASSET"
          curl -sSLf -o "$ASSET.sha256" "$BASE/$ASSET.sha256"
          echo "$(awk '{print $1}' "$ASSET.sha256")  $ASSET" | sha256sum -c -
          unzip -q "$ASSET"
          mkdir -p ~/.smithy-cli
          mv smithy-cli-linux-x86_64/* ~/.smithy-cli/

      - name: Put the Smithy CLI on PATH
        run: |
          echo "$HOME/.smithy-cli/bin" >> "$GITHUB_PATH"

      # Fails here, naming the version, rather than inside a build task three steps later.
      - name: Check the Smithy CLI version
        run: |
          set -euo pipefail
          test "$(smithy --version)" = "$SMITHY_VERSION"
          smithy --version

      - run: dotnet build Hardened.slnx --no-restore --configuration Release -p:ContinuousIntegrationBuild=true

      # Everything except the simulator tier, which is its own solution and runs in the step after
      # this one. A container test exercises code in another process, so it contributes nothing to
      # these numbers and would only hold the coverage run open while emulators start.
      - name: Test with coverage
        run: |
          set -o pipefail
          dotnet test Hardened.slnx \
            --no-build --configuration Release \
            --settings coverage.runsettings \
            --collect:"Code Coverage" \
            --results-directory ./coverage \
            | tee test-output.log

      # The simulator tier: a fixture's build output inside the image its cloud runs it in, driven
      # by that cloud's emulator through Testcontainers. Its own solution, because a trait filter on
      # `dotnet test` filters nothing on this SDK; see the note in Hardened.Simulators.slnx. Built
      # here rather than with the main solution so the two builds cannot disagree about a fixture:
      # the applications it mounts were built by the main build, in the same configuration, and
      # only the test projects themselves are new. Docker is on the runner; a test that cannot reach
      # it fails rather than skips, as every Docker test here does. The same skip checks below read
      # this log too.
      - name: Simulators
        run: |
          set -o pipefail
          dotnet build Hardened.Simulators.slnx --no-restore --configuration Release -p:ContinuousIntegrationBuild=true
          dotnet test Hardened.Simulators.slnx \
            --no-build --configuration Release \
            | tee simulator-output.log

      - name: Fail if any test was silently skipped
        run: |
          if grep -q "duplicate ID" test-output.log simulator-output.log; then
            echo "::error::Test cases were silently skipped due to duplicate test-case IDs."
            grep "duplicate ID" test-output.log simulator-output.log
            exit 1
          fi
          if grep -Eq "Skipped:[[:space:]]*[1-9]" test-output.log simulator-output.log; then
            echo "::error::Tests skipped in CI. A skipped test is one the suite is not running."
            grep -E "Skipped:[[:space:]]*[1-9]" test-output.log simulator-output.log
            exit 1
          fi

      - name: Coverage gate
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:"coverage/**/*.cobertura.xml" \
            -targetdir:coverage-report \
            -assemblyfilters:"+Hardened.*;-Hardened.DependencyModules.SourceGenerator" \
            -reporttypes:"TextSummary;MarkdownSummaryGithub;JsonSummary"
          cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/coverage-gate.py --summary coverage-report/Summary.json

      # An explicit list rather than packing the solution. Packing the solution sweeps in whatever
      # is not marked IsPackable=false, which is how Hardened.IntegrationTests.Console.SUT and
      # .OpenApi.SUT ended up on the GitHub feed as packages. On nuget.org a mistake like that
      # claims a public ID permanently.
      #
      # Hardened.DependencyModules.SourceGenerator is deliberately absent. Its generator ships
      # embedded in Hardened.Library.SourceGenerator's analyzers/dotnet/cs, because both projects
      # compile CSharpAuthor in from source and an assembly reference between them collides on
      # CSharpAuthor.TypeExtensions - so a nuspec dependency is not available and embedding is the
      # only mechanism that works. Publishing it standalone as well, as v0.1.0-rc1 did, put the
      # same generator in two packages: a consumer referencing both loaded it twice and both
      # copies emitted the module onto the same partial class, failing with CS0111/CS8646. One
      # publishable supplier is what keeps that impossible.
      # The count check below catches a package removed from the list. It cannot catch one that was
      # never added: it compares against a literal, so a package nobody listed is a package nobody
      # misses. That is how Hardened.Idl.SourceGenerator and Hardened.Smithy.SourceGenerator sat
      # unpublished from #133, and Hardened.Web.StaticContent from #146, while every release since
      # reported success.
      #
      # This asks the other question - is anything packable absent from the list - which is the one
      # that finds a new project rather than a deleted line.
      - name: Verify the pack list covers every packable project
        run: |
          set -euo pipefail

          # Hardened.DependencyModules.SourceGenerator is packable and deliberately unlisted: its
          # generator ships inside Hardened.Library.SourceGenerator's analyzers/dotnet/cs, and
          # publishing it standalone as well - which v0.1.0-rc1 did - puts the same generator in two
          # packages, so a consumer referencing both fails with CS0111/CS8646.
          EXEMPT="Hardened.DependencyModules.SourceGenerator"

          # Two kinds of path are not this repository's packages and must not be searched for
          # here.
          #
          # A project under templates/ is scaffolded into somebody else's repository, where they
          # may well pack it - Hardened1.Client is packable because a consumer's client project
          # should be. It is content, not a package this repository ships, and treating it as one
          # failed the 0.20.0-rc1000 release at this step.
          #
          # obj/ is build output. The template staging step copies templates/ into
          # obj/staged-templates/, so every template project appears twice on a machine that has
          # built, and the second copy exists or not depending on what ran before this.
          MISSING=""
          while IFS= read -r project; do
            name=$(basename "$project" .csproj)
            case " $EXEMPT " in *" $name "*) continue ;; esac
            grep -qF "$project" .github/workflows/release.yaml || MISSING="$MISSING $name"
          done < <(grep -rl "<IsPackable>[Tt]rue</IsPackable>" --include='*.csproj' src \
                     | grep -v '/obj/' \
                     | grep -v '/Hardened.Templates/templates/' \
                     | sort)

          if [ -n "$MISSING" ]; then
            echo "::error::These projects are packable but absent from the pack list:$MISSING"
            exit 1
          fi
          echo "The pack list covers every packable project."

      - name: Pack
        run: |
          for project in \
            src/Requests/Hardened.Requests.Abstract/Hardened.Requests.Abstract.csproj \
            src/Requests/Hardened.Requests.Caching.Memory/Hardened.Requests.Caching.Memory.csproj \
            src/Requests/Hardened.Requests.Runtime/Hardened.Requests.Runtime.csproj \
            src/Requests/Hardened.Requests.Testing/Hardened.Requests.Testing.csproj \
            src/Requests/Serializers/Hardened.Requests.Serializers.Newtonsoft/Hardened.Requests.Serializers.Newtonsoft.csproj \
            src/Shared/Hardened.Shared.Runtime/Hardened.Shared.Runtime.csproj \
            src/Shared/Hardened.Shared.Testing/Hardened.Shared.Testing.csproj \
            src/Shared/Hardened.Shared.Testing.NUnit/Hardened.Shared.Testing.NUnit.csproj \
            src/Shared/Hardened.Shared.Testing.xUnit/Hardened.Shared.Testing.xUnit.csproj \
            src/SourceGenerators/Hardened.SourceGenerator/Hardened.SourceGenerator.csproj \
            src/SourceGenerators/Hardened.SourceGeneration.Testing/Hardened.SourceGeneration.Testing.csproj \
            src/SourceGenerators/Hardened.Function.SourceGenerator/Hardened.Function.SourceGenerator.csproj \
            src/SourceGenerators/Hardened.Library.SourceGenerator/Hardened.Library.SourceGenerator.csproj \
            src/SourceGenerators/Hardened.Idl.SourceGenerator/Hardened.Idl.SourceGenerator.csproj \
            src/SourceGenerators/Hardened.OpenApi.SourceGenerator/Hardened.OpenApi.SourceGenerator.csproj \
            src/SourceGenerators/Hardened.Smithy.SourceGenerator/Hardened.Smithy.SourceGenerator.csproj \
            src/SourceGenerators/Hardened.Validation.SourceGenerator/Hardened.Validation.SourceGenerator.csproj \
            src/SourceGenerators/Hardened.Web.SourceGenerator/Hardened.Web.SourceGenerator.csproj \
            src/Web/Hardened.Web.Runtime/Hardened.Web.Runtime.csproj \
            src/Web/Hardened.Web.AspNetCore.Runtime/Hardened.Web.AspNetCore.Runtime.csproj \
            src/Web/Hardened.Web.AspNetCore.Testing/Hardened.Web.AspNetCore.Testing.csproj \
            src/Web/Hardened.Web.Kestrel.Runtime/Hardened.Web.Kestrel.Runtime.csproj \
            src/Web/Hardened.Web.Kestrel.Testing/Hardened.Web.Kestrel.Testing.csproj \
            src/Web/Hardened.Web.StaticContent/Hardened.Web.StaticContent.csproj \
            src/Web/Hardened.Web.Testing/Hardened.Web.Testing.csproj \
            src/Functions/Hardened.CloudEvents/Hardened.CloudEvents.csproj \
            src/Functions/Hardened.Functions.Runtime/Hardened.Functions.Runtime.csproj \
            src/Functions/Hardened.Functions.Testing/Hardened.Functions.Testing.csproj \
            src/Clouds/Aws/Hardened.Aws.Lambda/Hardened.Aws.Lambda.csproj \
            src/Clouds/Aws/Hardened.Aws.Lambda.Runtime/Hardened.Aws.Lambda.Runtime.csproj \
            src/Clouds/Aws/Hardened.Aws.Lambda.ApiGateway/Hardened.Aws.Lambda.ApiGateway.csproj \
            src/Clouds/Aws/Hardened.Aws.Lambda.DynamoDb/Hardened.Aws.Lambda.DynamoDb.csproj \
            src/Clouds/Aws/Hardened.Aws.Lambda.EventBridge/Hardened.Aws.Lambda.EventBridge.csproj \
            src/Clouds/Aws/Hardened.Aws.Lambda.Invoke/Hardened.Aws.Lambda.Invoke.csproj \
            src/Clouds/Aws/Hardened.Aws.Lambda.Kinesis/Hardened.Aws.Lambda.Kinesis.csproj \
            src/Clouds/Aws/Hardened.Aws.Lambda.S3/Hardened.Aws.Lambda.S3.csproj \
            src/Clouds/Aws/Hardened.Aws.Lambda.Sns/Hardened.Aws.Lambda.Sns.csproj \
            src/Clouds/Aws/Hardened.Aws.Lambda.Sqs/Hardened.Aws.Lambda.Sqs.csproj \
            src/Clouds/Aws/Hardened.Aws.Lambda.Testing/Hardened.Aws.Lambda.Testing.csproj \
            src/Clouds/Aws/Hardened.Aws.DynamoDbClient/Hardened.Aws.DynamoDbClient.csproj \
            src/Clouds/Aws/Hardened.Aws.DynamoDbClient.Testing/Hardened.Aws.DynamoDbClient.Testing.csproj \
            src/Clients/Hardened.Kiota.Testing/Hardened.Kiota.Testing.csproj \
            src/Clients/Hardened.Refit.Testing/Hardened.Refit.Testing.csproj \
            src/Templates/Hardened.Templates.RazorBlade/Hardened.Templates.RazorBlade.csproj \
            src/Templates/Hardened.Templates/Hardened.Templates.csproj; do
            dotnet pack "$project" --configuration Release --no-build --output ./artifacts \
              "/p:PackageVersion=${{ steps.version.outputs.version }}"
          done
          ls -la ./artifacts

      # Checked rather than assumed: a project silently dropped from the list above would
      # otherwise ship a partial release, and the missing package would only surface when a
      # consumer failed to restore it.
      - name: Verify every expected package was produced
        run: |
          # Deliberately a literal rather than derived from the list above. Counting the list
          # would make this agree with itself and check nothing; a number someone has to change
          # is what makes adding a package a two-line edit instead of a silent one.
          #
          # 19 when the list was written. #108 added Hardened.Templates.RazorBlade and
          # Hardened.Validation.SourceGenerator to the pack list and did not update this, which is
          # what this step is for - it failed the v0.1.0-rc1 release before anything was pushed.
          # 20 after Hardened.DependencyModules.SourceGenerator was removed from the list; see the
          # note above the pack step for why it is not published on its own.
          # 18 after Hardened.Commands and Hardened.Console.SourceGenerator were removed - command
          # line parsing shares nothing with the request pipeline and was dropped to shrink the
          # surface area. The 0.4.0-rc1000 packages of both remain on nuget.org and are
          # deliberately left listed.
          # 21 after the three packable projects this list had drifted from were added:
          # Hardened.Idl.SourceGenerator and Hardened.Smithy.SourceGenerator, which arrived in #133
          # and were never listed, and Hardened.Web.StaticContent, which arrived in #146 and was
          # not either. The check above could not catch any of them - it compares the count against
          # this number, so a package nobody added is a package nobody misses.
          # 22 after Hardened.Templates, the dotnet new templates, arrived in #154. It was added to
          # the solution and not here, so the coverage check above would have failed the next
          # release - which is the check working, and the fourth time this list has drifted.
          # 23 after Hardened.Requests.Caching.Memory, the response cache store, arrived with
          # response caching.
          # 25 after the two client testing packages, Hardened.Kiota.Testing and
          # Hardened.Refit.Testing.
          # 27 after the runner split: Hardened.Shared.Testing.xUnit and
          # Hardened.Shared.Testing.NUnit, with Hardened.Shared.Testing left runner-neutral.
          # 28 after Hardened.Web.Kestrel.Testing, the [KestrelHost] test host.
          # 29 after Hardened.Web.AspNetCore.Testing, the [AspNetCoreHost] test host.
          # 43 while Hardened.Amz's fourteen were in the tree, and 29 again once they left. That
          # line is not being renamed into Hardened.Aws, it is being replaced by new projects, so
          # its source earns nothing here: 0.22.0-rc1000 stays on nuget.org, restorable, and the
          # replacements join this list as they are written.
          # 39 with the AWS line and the trigger attributes, which is ten and not eight. Eight are
          # the Lambda packages: a core, five adapters, the Hardened.Aws.Lambda meta package over
          # them and the testing package. The other two are Hardened.Functions.Runtime and
          # Hardened.Functions.Testing, which have been IsPackable and absent from this list since
          # they were written - the sixth time it has drifted, and the reason the number below is a
          # literal somebody has to change.
          # 40 with Hardened.Aws.Lambda.DynamoDb, the first adapter added after the split - which
          # is the shape every later one takes: one package, one trigger, one line here.
          # 41 with Hardened.Aws.Lambda.Kinesis, the second adapter added after the split.
          # 42 with Hardened.Aws.Lambda.S3.
          # 44 with the DynamoDB client and its testing package, restored from the Amz line.
          # 45 with Hardened.CloudEvents, the dependency-free CloudEvents reader the GCP line and the
          # Azure [Event] adapter share.
          EXPECTED=45
          ACTUAL=$(ls -1 ./artifacts/*.nupkg 2>/dev/null | wc -l | tr -d ' ')

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Packed $ACTUAL packages, expected $EXPECTED. Update the list in this workflow if a package was added or removed."
            ls -1 ./artifacts/*.nupkg || true
            exit 1
          fi
          echo "All $EXPECTED packages present."

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: ./artifacts/*

      - name: Push to nuget.org
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            --api-key "${{ secrets.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --source "https://nuget.pkg.github.com/ipjohnson/index.json" \
            --skip-duplicate --no-symbols

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A version carrying a prerelease label must not appear as a stable release.
          case "${{ steps.version.outputs.version }}" in
            *-*) prerelease="--prerelease" ;;
            *)   prerelease="" ;;
          esac

          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            ${prerelease} \
            ./artifacts/*.nupkg

      # The documented version used to be an issue opened in another repository from here, by a
      # step that could not fail the release: the site declared its own package version, nothing
      # checked it, and the pages sat a release behind for as long as nobody acted on the issue.
      # They were on 0.21.0-rc1000 when 0.22.0-rc1000 shipped. The pages are in this repository
      # now, so the release checks them.
      #
      # Only versions a reader would copy - a PackageReference, HardenedVersion, a template
      # install - so prose naming an older release on purpose does not trip it. docs/design is
      # maintainer notes and is a record of when things happened, not of what to install.
      #
      # Hardened.Amz is the one exemption. That line stopped at 0.22.0-rc1000 and is being
      # replaced by Hardened.Aws rather than renamed, so the AWS pages pin a release that does not
      # move. Prose is how the other frozen references say so, and a PackageReference has no way
      # to phrase itself as historical, so it is named here instead.
      #
      # Finding nothing is a failure rather than a pass. The check is one regex away from matching
      # none of the pages, and a silent green is the state it was written to end.
      - name: Check the documented version is this one
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          COPYABLE='(Version="|<HardenedVersion>|Hardened\.Templates@)[0-9]+\.[0-9]+\.[0-9]+-rc[0-9]+'

          CITED=$(grep -rnE "$COPYABLE" \
                    docs --include='*.md' \
                    --exclude-dir=design \
                  | grep -v 'Hardened\.Amz\.' || true)

          FOUND=$(echo "$CITED" | grep -oE "$COPYABLE" \
                  | grep -oE '[0-9]+\.[0-9]+\.[0-9]+-rc[0-9]+' | sort -u || true)

          if [ -z "$FOUND" ]; then
            echo "::error::No page under docs/ tells a reader which version to install, so this check proved nothing."
            exit 1
          fi

          WRONG=$(echo "$FOUND" | grep -vxF "$VERSION" || true)

          if [ -n "$WRONG" ]; then
            echo "::error::Pages under docs/ tell a reader to install a version that is not $VERSION: $(echo $WRONG)."
            echo "$CITED" | grep -E "($(echo $WRONG | tr ' ' '|'))" || true
            exit 1
          fi
          echo "Every version the documentation tells a reader to install is $VERSION."
