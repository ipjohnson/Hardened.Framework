name: build-package

# Publishing is restricted to main. Previously this workflow ran on `[push]` with no
# branch filter, so every push to any branch packed and pushed packages to the feed.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Must equal $(HardenedSmithyCliVersion); the build fails with HSMT011 if it does not.
      SMITHY_VERSION: 1.73.0

    steps:
      - uses: actions/checkout@v4

      # No source-url, and no NUGET_AUTH_TOKEN. Restore reads nuget.config, which is nuget.org
      # and nothing else since ValidationModules was published there at 0.1.0-alpha.1.
      #
      # It used to point setup-dotnet at GitHub Packages, which writes a nuget.config whose
      # credential is the literal string %NUGET_AUTH_TOKEN% - expanded by NuGet when it restores,
      # not when the config is written. The variable therefore had to still be set at restore time,
      # and an authenticated source that answers 401 is fatal to the whole restore rather than to
      # the packages it serves. Neither hazard is worth carrying for a feed nothing needs.
      #
      # The push step below is unaffected: it names its feed and key on the command line.
      #
      # Two SDKs, and both are load-bearing. global.json pins the build to the .NET 11 preview,
      # which is the compiler that can read a C# 15 union. But every project here targets net8.0 and
      # every test assembly is framework-dependent on Microsoft.NETCore.App 8.0.0 with no
      # rollForward of its own - and the default policy is Minor, which does not cross a major
      # version. An 11-only runner compiles everything and then starts no test host at all. The
      # 8.0.x entry is here for the runtime, not the compiler.
      #
      # The preview is named exactly rather than as 11.0.x. A floating preview is how local builds
      # silently moved SDK mid-session on 2026-08-20, and it is harder to see happening here.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            11.0.100-preview.7.26381.103

      # The Smithy CLI turns the .smithy models in the integration fixture into the JSON AST the
      # build task reads. It is pinned, and the build enforces the pin rather than trusting it:
      # $(HardenedSmithyCliVersion) in Hardened.Smithy.SourceGenerator.targets must equal
      # SMITHY_VERSION below, or the build stops with HSMT011 instead of generating against
      # whatever version happens to be installed. Two versions can produce different ASTs, and
      # therefore different generated C#, from identical sources.
      #
      # Cached because the archive is 27 MB and the download is the only slow part; the CLI itself
      # runs once per model edit, not once per build.
      - name: Cache the Smithy CLI
        id: smithy-cli
        uses: actions/cache@v4
        with:
          path: ~/.smithy-cli
          key: smithy-cli-${{ env.SMITHY_VERSION }}-linux-x86_64

      # Verified against the checksum the release publishes beside it. A build that downloads and
      # executes a binary should say which one it expected.
      - name: Install the Smithy CLI
        if: steps.smithy-cli.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          ASSET=smithy-cli-linux-x86_64.zip
          BASE=https://github.com/smithy-lang/smithy/releases/download/$SMITHY_VERSION
          curl -sSLf -o "$ASSET" "$BASE/$ASSET"
          curl -sSLf -o "$ASSET.sha256" "$BASE/$ASSET.sha256"
          echo "$(awk '{print $1}' "$ASSET.sha256")  $ASSET" | sha256sum -c -
          unzip -q "$ASSET"
          mkdir -p ~/.smithy-cli
          mv smithy-cli-linux-x86_64/* ~/.smithy-cli/

      - name: Put the Smithy CLI on PATH
        run: |
          echo "$HOME/.smithy-cli/bin" >> "$GITHUB_PATH"

      # Fails here, naming the version, rather than inside a build task three steps later.
      - name: Check the Smithy CLI version
        run: |
          set -euo pipefail
          test "$(smithy --version)" = "$SMITHY_VERSION"
          smithy --version

      - run: dotnet restore Hardened.slnx
      - run: dotnet restore Hardened.Simulators.slnx

      # ContinuousIntegrationBuild turns warnings into errors (see src/Directory.Build.props).
      # The solution builds warning-free; this is what stops that drifting back.
      - run: dotnet build Hardened.slnx --no-restore --configuration Release -p:ContinuousIntegrationBuild=true

      # The claim the framework is sold on, checked rather than asserted.
      #
      # IsAotCompatible on the runtime packages makes `dotnet build` fail on a trim-unsafe call,
      # which is most of it. It is not all of it: the analyzer works per assembly and per compile,
      # so an incremental build can report clean by not rebuilding the project with the problem,
      # and it says nothing about whether ILC can actually produce a binary. This step is what says
      # both - ILC analyses the whole program, including everything the generators emitted.
      #
      # `-warnaserror`, because IL2026 and IL3050 are the entire point: a warning here is a call
      # that works today and stops working once something is trimmed away. It is the MSBuild switch
      # rather than TreatWarningsAsErrors, which src/Directory.Build.props already sets for CI - that
      # one is the C# compiler's and does not cover what ILC reports.
      #
      # No apt-get. ILC needs a C compiler and zlib, and the runner image already has both -
      # zlib1g-dev reported "already the newest version" on every run, and the only package apt
      # ever installed was the unversioned `clang` meta-package, a symlink whose payload clang-18
      # was already present. So the step bought an alias at the price of a network round trip to
      # the Ubuntu mirrors, and on 2026-08-18 that round trip hung: `apt-get update` stalled after
      # noble-security InRelease and the job was cancelled 25 minutes later, on a step that
      # normally takes 24 seconds.
      #
      # Discovered rather than pinned, because the image's clang major version moves and a pinned
      # clang-18 becomes a build break the day it does.
      - name: Publish the integration application with Native AOT
        run: |
          # The alias if the image has one, otherwise the highest versioned clang on it.
          CLANG="$(command -v clang || ls /usr/bin/clang-[0-9]* 2>/dev/null | sort -V | tail -1)"

          if [ -z "$CLANG" ]; then
            echo "::error::No clang on the runner image, and this step no longer installs one."
            exit 1
          fi

          echo "using $CLANG ($("$CLANG" --version | head -1))"

          # All three. A native binary that serves an HTTP request says nothing about the
          # function path: a different adapter, a batch fan-out, and an answer written back to the
          # Lambda Runtime API rather than to a socket.
          for app in Hardened.IntegrationTests.Aot.SUT Hardened.IntegrationTests.Aot.Lambda.SUT Hardened.IntegrationTests.Aot.CloudRun.SUT; do
            dotnet publish "src/IntegrationTests/Aot/$app/$app.csproj" \
              --configuration Release \
              --runtime linux-x64 \
              -p:CppCompilerAndLinker="$CLANG" \
              -p:ContinuousIntegrationBuild=true \
              -warnaserror
          done

          # The Azure Functions worker, outside the loop because -warnaserror cannot apply to it
          # whole: Microsoft.Azure.Functions.Worker.Core and .Grpc 2.2.0, the worker extensions
          # and Google.Protobuf under the gRPC channel carry trim and AOT warnings of their own -
          # the reflection-based metadata provider, method locator and invoker that Hardened's
          # generated pair replace among them. So the gate here is the same one, applied per
          # assembly: every warning is printed with the assembly it came from, and one from a
          # Hardened assembly fails the step. A warning from the worker's own assemblies is
          # theirs, and is recorded in the plan's risk table.
          #
          # Published twice. With PublishAot, which is the gate: ILC compiles the whole graph and
          # the output is checked to be the native binary the runtime package's targets name in
          # worker.config.json. Then trimmed and self-contained, which is what the host probe
          # below runs: the worker package cannot start as a native binary, because
          # Worker.Core's WorkerInformation reads its own assembly's Location in a static
          # initializer and Native AOT has none (Azure/azure-functions-dotnet-worker#1056), so the
          # closest publish the real host can run is the trimmed one, with the same analysis and
          # the same rooting.
          app=Hardened.IntegrationTests.Aot.AzureFunctions.SUT
          dotnet publish "src/IntegrationTests/Aot/$app/$app.csproj" \
            --configuration Release \
            --runtime linux-x64 \
            -p:CppCompilerAndLinker="$CLANG" \
            -p:ContinuousIntegrationBuild=true \
            -p:TrimmerSingleWarn=false \
            2>&1 | tee azure-aot-publish.log

          if grep -E 'warning IL[0-9]+' azure-aot-publish.log | grep -v -E 'Microsoft\.Azure\.Functions\.Worker|DotNetWorker|Google\.Protobuf' | grep -q .; then
            echo "::error::The native Azure Functions worker produced trim or AOT warnings outside the worker's own assemblies:"
            grep -E 'warning IL[0-9]+' azure-aot-publish.log | grep -v -E 'Microsoft\.Azure\.Functions\.Worker|DotNetWorker|Google\.Protobuf'
            exit 1
          fi

          publish=$(find "src/IntegrationTests/Aot/$app" -type d -path '*/publish' | head -1)

          if [ -z "$publish" ] || [ ! -x "$publish/$app" ]; then
            echo "::error::No native Azure Functions worker was produced."
            exit 1
          fi

          if ls "$publish"/*.dll >/dev/null 2>&1; then
            echo "::error::The native publish output carries managed assemblies."
            exit 1
          fi

          echo "native worker: $publish/$app ($(du -h "$publish/$app" | cut -f1))"
          cat "$publish/worker.config.json"

          case "$(cat "$publish/worker.config.json")" in
            *'"defaultExecutablePath": "{WorkerRoot}'"$app"'"'*) ;;
            *) echo "::error::worker.config.json does not name the native binary as the worker."; exit 1 ;;
          esac

          rm -rf "$publish"

          dotnet publish "src/IntegrationTests/Aot/$app/$app.csproj" \
            --configuration Release \
            --runtime linux-x64 \
            -p:HardenedTrimmedWorker=true \
            -p:ILLinkTreatWarningsAsErrors=false \
            -p:ContinuousIntegrationBuild=true \
            -p:TrimmerSingleWarn=false \
            2>&1 | tee azure-trimmed-publish.log

          if grep -E 'warning IL[0-9]+' azure-trimmed-publish.log | grep -v -E 'Microsoft\.Azure\.Functions\.Worker|DotNetWorker|Google\.Protobuf' | grep -q .; then
            echo "::error::The trimmed Azure Functions worker produced trim warnings outside the worker's own assemblies:"
            grep -E 'warning IL[0-9]+' azure-trimmed-publish.log | grep -v -E 'Microsoft\.Azure\.Functions\.Worker|DotNetWorker|Google\.Protobuf'
            exit 1
          fi

      # And that the binary serves a request, which a clean compile does not tell you: a trimmer
      # removes what nothing references, so the failure this catches is a route, a binder or a
      # serializer that resolved through metadata ILC could not see.
      - name: Serve a request from the native binary
        run: |
          set -o pipefail

          # Scoped to publish/, because the IL apphost in bin/ carries the same name and is also
          # executable - running that one would prove nothing about ILC.
          binary=$(find src/IntegrationTests/Aot -type f -path '*/publish/*' \
            -name 'Hardened.IntegrationTests.Aot.SUT' -perm -u+x | head -1)

          if [ -z "$binary" ]; then
            echo "::error::No native binary was produced."
            find src/IntegrationTests/Aot -name 'Hardened.IntegrationTests.Aot.SUT*' -type f || true
            exit 1
          fi

          # A native binary has no runtimeconfig beside it; an apphost does. Cheap way to be sure
          # the thing about to run is the one ILC produced.
          if [ -f "$(dirname "$binary")/Hardened.IntegrationTests.Aot.SUT.runtimeconfig.json" ]; then
            echo "::error::Found the framework-dependent apphost rather than the native binary."
            exit 1
          fi

          echo "native binary: $binary ($(du -h "$binary" | cut -f1))"

          "$binary" 5199 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT

          for _ in $(seq 1 40); do
            if curl -fsS "http://localhost:5199/health" >/dev/null 2>&1; then break; fi
            sleep 0.25
          done

          echo "health:  $(curl -fsS http://localhost:5199/health)"

          # Routing, path-token binding and source-generated serialization, in one request.
          body=$(curl -fsS http://localhost:5199/echo/hardened)
          echo "echo:    $body"

          case "$body" in
            *'"message":"hardened"'*'"length":8'*) echo "Native AOT binary served a bound, serialized response." ;;
            *) echo "::error::Unexpected response from the native binary: $body"; exit 1 ;;
          esac

      # The same question for a function. The binary stubs the Lambda Runtime API in-process, serves
      # one invocation and exits, so what this reads is the handler's own view of a payload that
      # went through the adapter's peek, the batch fan-out and a source-generated binder - every one
      # of which resolves through metadata ILC could have removed.
      - name: Serve an invocation from the native Lambda binary
        run: |
          set -o pipefail

          binary=$(find src/IntegrationTests/Aot -type f -path '*/publish/*' \
            -name 'Hardened.IntegrationTests.Aot.Lambda.SUT' -perm -u+x | head -1)

          if [ -z "$binary" ]; then
            echo "::error::No native Lambda binary was produced."
            find src/IntegrationTests/Aot -name 'Hardened.IntegrationTests.Aot.Lambda.SUT*' -type f || true
            exit 1
          fi

          if [ -f "$(dirname "$binary")/Hardened.IntegrationTests.Aot.Lambda.SUT.runtimeconfig.json" ]; then
            echo "::error::Found the framework-dependent apphost rather than the native binary."
            exit 1
          fi

          echo "native binary: $binary ($(du -h "$binary" | cut -f1))"

          # It exits on its own: AWS_LAMBDA_DOTNET_DEBUG_RUN_ONCE is set inside the program.
          output=$(timeout 60 "$binary" 2>&1) || {
            echo "::error::The native Lambda binary did not complete."
            echo "$output"
            exit 1
          }

          echo "$output"

          case "$output" in
            *"HANDLED a-1 x7"*) echo "Native AOT binary served a bound queue message." ;;
            *) echo "::error::The native Lambda binary did not handle the invocation."; exit 1 ;;
          esac

      # The same question for a Cloud Run service, which is both of the above on one socket: the
      # front door ahead of routing recognises a Pub/Sub push or a CloudEvent and hands it to the
      # function path, and a plain GET goes to the web path through the same composite dispatch.
      # Both dispatches, the decorator that composes them and the adapters' registrations are
      # static initializers a generator emitted, which is exactly what ILC could have removed. The
      # Firestore event is protobuf, decoded by the one Google dependency in the line, which the
      # analyzers cannot vouch for; a decoded document with its old value is the proof. The binary
      # runs until SIGTERM the way a Cloud Run instance does, so the probe sends one and reads what
      # the handlers printed.
      - name: Serve a push, a document event and a route from the native Cloud Run binary
        run: |
          set -o pipefail

          binary=$(find src/IntegrationTests/Aot -type f -path '*/publish/*' \
            -name 'Hardened.IntegrationTests.Aot.CloudRun.SUT' -perm -u+x | head -1)

          if [ -z "$binary" ]; then
            echo "::error::No native Cloud Run binary was produced."
            find src/IntegrationTests/Aot -name 'Hardened.IntegrationTests.Aot.CloudRun.SUT*' -type f || true
            exit 1
          fi

          if [ -f "$(dirname "$binary")/Hardened.IntegrationTests.Aot.CloudRun.SUT.runtimeconfig.json" ]; then
            echo "::error::Found the framework-dependent apphost rather than the native binary."
            exit 1
          fi

          echo "native binary: $binary ($(du -h "$binary" | cut -f1))"

          # PORT is the container contract, and 5198 keeps clear of the Kestrel probe's 5199.
          PORT=5198 "$binary" >cloudrun.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT

          for _ in $(seq 1 40); do
            if curl -fsS "http://localhost:5198/health" >/dev/null 2>&1; then break; fi
            sleep 0.25
          done

          echo "health:  $(curl -fsS http://localhost:5198/health)"

          # {"id":"a-1","quantity":7}, base64, inside the push body a subscription named orders-new
          # sends. The front door unwraps it, the route comes off the subscription, the body is
          # bound through the source-generated context, and a 200 is the acknowledgement.
          push=$(curl -s -o /dev/null -w '%{http_code}' -X POST "http://localhost:5198/" \
            -H 'Content-Type: application/json' \
            -d '{"message":{"data":"eyJpZCI6ImEtMSIsInF1YW50aXR5Ijo3fQ==","messageId":"1","publishTime":"2026-09-08T00:00:00Z"},"subscription":"projects/p/subscriptions/orders-new"}')
          echo "push:    $push"

          # A Firestore DocumentEventData for orders/a-1, quantity 3 before and 7 after, as the
          # protobuf bytes Eventarc sends in binary mode. The route comes off ce-subject, the new
          # document is projected to JSON for the body, and [OldValue] binds the old one.
          echo 'ClMKM3Byb2plY3RzL3AvZGF0YWJhc2VzLyhkZWZhdWx0KS9kb2N1bWVudHMvb3JkZXJzL2EtMRIMCgJpZBIGigEDYS0xEg4KCHF1YW50aXR5EgIQBxJTCjNwcm9qZWN0cy9wL2RhdGFiYXNlcy8oZGVmYXVsdCkvZG9jdW1lbnRzL29yZGVycy9hLTESDAoCaWQSBooBA2EtMRIOCghxdWFudGl0eRICEAM=' \
            | base64 --decode >firestore-event.bin

          change=$(curl -s -o /dev/null -w '%{http_code}' -X POST "http://localhost:5198/" \
            -H 'Content-Type: application/protobuf' \
            -H 'ce-specversion: 1.0' \
            -H 'ce-id: 2' \
            -H 'ce-type: google.cloud.firestore.document.v1.updated' \
            -H 'ce-source: //firestore.googleapis.com/projects/p/databases/(default)' \
            -H 'ce-subject: documents/orders/a-1' \
            -H 'ce-time: 2026-09-08T00:00:00Z' \
            --data-binary @firestore-event.bin)
          echo "change:  $change"

          # SIGTERM, which is how Cloud Run retires an instance; the drain exits 0.
          kill -TERM "$pid"
          wait "$pid"
          echo "exit:    $?"

          cat cloudrun.log

          case "$push" in
            2*) ;;
            *) echo "::error::The native Cloud Run binary answered the push with $push."; exit 1 ;;
          esac

          case "$change" in
            2*) ;;
            *) echo "::error::The native Cloud Run binary answered the document event with $change."; exit 1 ;;
          esac

          output=$(cat cloudrun.log)

          case "$output" in
            *"HANDLED a-1 x7"*) ;;
            *) echo "::error::The native Cloud Run binary did not handle the push."; exit 1 ;;
          esac

          case "$output" in
            *"CHANGED a-1 x7 from x3"*) echo "Native AOT binary served a bound Pub/Sub push, a decoded Firestore event and a web route." ;;
            *) echo "::error::The native Cloud Run binary did not decode the document event."; exit 1 ;;
          esac

      # The same question for an Azure Functions worker, which the Functions host starts rather
      # than the other way round: the host runs in its own container, reads worker.config.json
      # from the publish output, starts the trimmed worker, asks it over gRPC for the functions it
      # serves, and indexes what the generated metadata provider answered - a static list, which
      # is the whole reason a trimmed worker can be indexed at all. Then a request for the web
      # route goes through the host to the generated executor, the shim and the invocation
      # handler's per-invocation choice of dispatch, every one of which is a static initializer
      # or a generic registration the trimmer could have removed. The publish step above says why
      # the worker is the trimmed one rather than the native binary.
      #
      # The queue function needs a Service Bus namespace to start its listener and the host needs
      # a storage account for its own bookkeeping, so the Service Bus emulator, the SQL Server it
      # keeps its state in and Azurite run beside the host on one network, the same arrangement
      # the repository's container tier uses. The host image is the one a deployment runs.
      - name: Index and serve a route from the trimmed Azure Functions worker
        run: |
          set -o pipefail

          app=Hardened.IntegrationTests.Aot.AzureFunctions.SUT
          publish=$(find "src/IntegrationTests/Aot/$app" -type d -path '*/publish' | head -1)

          if [ -z "$publish" ] || [ ! -x "$publish/$app" ] || [ ! -f "$publish/$app.dll" ]; then
            echo "::error::No trimmed Azure Functions worker was produced."
            find src/IntegrationTests/Aot -name "$app*" -type f || true
            exit 1
          fi

          echo "trimmed worker: $publish ($(du -sh "$publish" | cut -f1), $(ls "$publish"/*.dll | wc -l) assemblies)"
          echo "worker.config.json:"
          cat "$publish/worker.config.json"

          case "$(cat "$publish/worker.config.json")" in
            *'"defaultExecutablePath": "{WorkerRoot}'"$app"'"'*) ;;
            *) echo "::error::worker.config.json does not name the worker's executable."; exit 1 ;;
          esac

          config=src/IntegrationTests/Aot/Hardened.IntegrationTests.Aot.AzureFunctions.SUT/ServiceBusEmulator.json

          docker network create hardened-aot
          trap 'docker rm -f hardened-host hardened-servicebus hardened-mssql hardened-azurite >/dev/null 2>&1 || true; docker network rm hardened-aot >/dev/null 2>&1 || true' EXIT

          docker run -d --name hardened-azurite --network hardened-aot \
            mcr.microsoft.com/azure-storage/azurite:3.35.0 >/dev/null

          docker run -d --name hardened-mssql --network hardened-aot \
            -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD='Hardened!Aot1' \
            mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04 >/dev/null

          docker run -d --name hardened-servicebus --network hardened-aot \
            -e ACCEPT_EULA=Y -e SQL_SERVER=hardened-mssql -e MSSQL_SA_PASSWORD='Hardened!Aot1' \
            -v "$PWD/$config:/ServiceBus_Emulator/ConfigFiles/Config.json" \
            mcr.microsoft.com/azure-messaging/servicebus-emulator:2.0.1 >/dev/null

          for _ in $(seq 1 120); do
            if docker logs hardened-servicebus 2>&1 | grep -q "Emulator Service is Successfully Up"; then break; fi
            sleep 2
          done

          if ! docker logs hardened-servicebus 2>&1 | grep -q "Emulator Service is Successfully Up"; then
            echo "::error::The Service Bus emulator did not come up."
            docker logs hardened-servicebus 2>&1 | tail -40
            exit 1
          fi

          # The well-known development account Azurite serves, reached by the container's name,
          # and the emulator's fixed key; both are the same strings the container tier uses.
          storage='DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://hardened-azurite:10000/devstoreaccount1;QueueEndpoint=http://hardened-azurite:10001/devstoreaccount1;TableEndpoint=http://hardened-azurite:10002/devstoreaccount1;'
          servicebus='Endpoint=sb://hardened-servicebus:5672;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;'

          docker run -d --name hardened-host --network hardened-aot -p 5197:80 \
            -v "$PWD/$publish:/home/site/wwwroot:ro" \
            -e AzureWebJobsScriptRoot=/home/site/wwwroot \
            -e FUNCTIONS_WORKER_RUNTIME=dotnet-isolated \
            -e AzureFunctionsJobHost__Logging__Console__IsEnabled=true \
            -e AzureWebJobsStorage="$storage" \
            -e AzureWebJobsServiceBus="$servicebus" \
            mcr.microsoft.com/azure-functions/dotnet-isolated:4-dotnet-isolated8.0 >/dev/null

          for _ in $(seq 1 120); do
            if docker logs hardened-host 2>&1 | grep -q "Job host started"; then break; fi
            sleep 2
          done

          docker logs hardened-host >host.log 2>&1
          cat host.log

          if ! grep -q "Job host started" host.log; then
            echo "::error::The Functions host did not start with the trimmed worker."
            exit 1
          fi

          # What the host indexed: exactly the two functions the generated provider declares, on
          # the lines under "Found the following functions:".
          indexed=$(grep -oE 'Host\.Functions\.[A-Za-z0-9_]+$' host.log | sed 's/Host\.Functions\.//' | sort -u | tr '\n' ' ')
          echo "indexed: $indexed"

          case "$indexed" in
            "Http Queue_orders_new ") ;;
            *) echo "::error::The host indexed '$indexed' rather than the HTTP and queue functions the provider declares."; exit 1 ;;
          esac

          # The web route, through the host, the catch-all HTTP function and the trimmed worker's
          # generated executor, with the host's route prefix taken off by the adapter. The handler
          # returns a string, which the pipeline serializes, so the answer is "ok" in quotes.
          health=$(curl -fsS http://localhost:5197/api/health || true)
          echo "health:  $health"

          case "$health" in
            '"ok"'|ok) echo "Trimmed worker was indexed by the Functions host and served a web route through it." ;;
            *) echo "::error::The trimmed Azure Functions worker did not answer the web route."; docker logs hardened-host 2>&1 | tail -60; exit 1 ;;
          esac

      # The document the code-first generator emits, checked by a linter rather than only by a
      # reader. Microsoft.OpenApi already proves the specification-first side parses, and that is a
      # weaker claim than it sounds: path templating is prose in the OpenAPI specification rather
      # than schema, so a template naming a parameter that no `parameters` entry declares parses
      # fine and is a 404 for every generated client. That is what shipped until the emitter
      # stopped leaking route constraints into it.
      #
      # The integration SUT is the subject because it is the one application here carrying the
      # whole route surface: constrained tokens, catch-alls, every verb, validated bodies.
      #
      # Read from the export rather than scraped out of generated source. The SUT's own build
      # already wrote openapi/Application.json through <HardenedOpenApiOutput>, at the version the
      # application serves; this asks the same target for a second file at 3.1.0, which is the
      # newest banner Spectral's oas ruleset validates - a 3.2.0 document fails its
      # `oas3-schema` version pattern outright. Lowering here rather than in the SUT keeps the
      # tracked file byte-identical to the served document, which the SUT's tests assert.
      #
      # One target on one project, with the properties as global properties: nothing else is
      # built, so the property cannot reach a referenced project and fail it for carrying no
      # document. HRDOA030 names each streaming operation that loses its item schema on the way
      # down. A SUT that lost [Enable<OpenApiDocumentPublishing>] fails the build step above at
      # HRDOA018, before this runs.
      - name: Lint the generated OpenAPI document
        run: |
          set -o pipefail

          dotnet msbuild src/IntegrationTests/Web/Hardened.IntegrationTests.WebApp.SUT/Hardened.IntegrationTests.WebApp.SUT.csproj \
            -t:HardenedWriteOpenApiDocument \
            -p:Configuration=Release \
            -p:HardenedOpenApiOutput="$PWD/openapi-lint.json" \
            -p:HardenedOpenApiOutputVersion=3.1.0 \
            -nologo -v:m

          test -s openapi-lint.json

          npx --yes @stoplight/spectral-cli lint openapi-lint.json \
            --ruleset build/spectral.yaml \
            --fail-severity=error

      # Everything except the simulator tier, which is its own solution and runs in the step after
      # this one. A container test exercises code in another process, so it contributes nothing to
      # these numbers and would only hold the coverage run open while emulators start.
      - name: Test with coverage
        run: |
          set -o pipefail
          dotnet test Hardened.slnx \
            --no-build --configuration Release \
            --settings build/coverage.runsettings \
            --collect:"Code Coverage" \
            --results-directory ./coverage \
            | tee test-output.log

      # The simulator tier: a fixture's build output inside the image its cloud runs it in, driven
      # by that cloud's emulator through Testcontainers. Its own solution, because a trait filter on
      # `dotnet test` filters nothing on this SDK; see the note in Hardened.Simulators.slnx. Built
      # here rather than with the main solution so the two builds cannot disagree about a fixture:
      # the applications it mounts were built by the main build, in the same configuration, and
      # only the test projects themselves are new. Docker is on the runner; a test that cannot reach
      # it fails rather than skips, as every Docker test here does. The same skip checks below read
      # this log too.
      - name: Simulators
        run: |
          set -o pipefail
          dotnet build Hardened.Simulators.slnx --no-restore --configuration Release -p:ContinuousIntegrationBuild=true
          dotnet test Hardened.Simulators.slnx \
            --no-build --configuration Release \
            | tee simulator-output.log

      # xUnit drops test cases that share a unique ID, reporting it only as an
      # informational line. A green run can therefore hide tests that never executed.
      # Treat any such message as a build failure.
      - name: Fail if any test was silently skipped
        run: |
          if grep -q "duplicate ID" test-output.log simulator-output.log; then
            echo "::error::Test cases were silently skipped due to duplicate test-case IDs. Give the colliding test methods distinct names."
            grep "duplicate ID" test-output.log simulator-output.log
            exit 1
          fi
          echo "No silently skipped tests."

      # The check above catches tests that vanish by accident. This one catches
      # tests that vanish on purpose: a Skip is a test the suite is not running,
      # and once it is green nothing distinguishes it from one that passed.
      #
      # Skipping is still the right answer locally, for a machine missing
      # something the suite needs. It is not an answer on a runner, where
      # everything is present and a skip means a requirement went missing.
      #
      # A repro pinned to a defect belongs in the same change as the fix, so it
      # runs. If a test genuinely cannot run here, delete it and open an issue -
      # a permanent Skip is a comment that costs a test run.
      - name: Fail if any test skipped
        run: |
          if grep -Eq "Skipped:[[:space:]]*[1-9]" test-output.log simulator-output.log; then
            echo "::error::Tests skipped in CI. A skipped test is one the suite is not running - land the repro with its fix, or remove it."
            grep -E "Skipped:[[:space:]]*[1-9]" test-output.log simulator-output.log
            exit 1
          fi
          echo "Every test ran."

      - name: Coverage summary
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          # +Hardened.* because this collector instruments everything loaded rather than only what
          # a test project references, so xunit, RazorBlade and PublicApiGenerator all arrive in the
          # report otherwise. Filtered here rather than in the runsettings: ModulePaths/Include did
          # not restrict it, and a report-level filter does not depend on one collector's schema -
          # which is the property being bought by this change in the first place.
          #
          # Hardened.DependencyModules.SourceGenerator is excluded because it is not this
          # repository's code. It holds two files of its own - 148 lines - and compiles in the whole
          # of DependencyModules.SourceGenerator.Impl, 8,554 lines, via Compile Include. A floor on
          # that assembly is a floor on a sibling repository's source, moved by edits nobody here
          # made, and it says nothing about whether the 148 lines are tested.
          reportgenerator \
            -reports:"coverage/**/*.cobertura.xml" \
            -targetdir:coverage-report \
            -assemblyfilters:"+Hardened.*;-Hardened.DependencyModules.SourceGenerator" \
            -reporttypes:"TextSummary;MarkdownSummaryGithub;Html;JsonSummary"
          cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          cat coverage-report/Summary.txt

      # Coverage was measured and printed on every build and enforced nothing, so it could fall to
      # zero and stay green. This gate holds each assembly at the coverage it already had.
      # Raising a floor is a deliberate act: scripts/coverage-gate.py --update, reviewed and committed.
      #
      - name: Coverage gate
        run: python3 scripts/coverage-gate.py --summary coverage-report/Summary.json

      # always(), because the report is most wanted exactly when the gate rejected the run - and
      # the gate is the step before this one, so a failure used to mean no artifact to look at.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage-report

      # The continuous feed's version has to sort BELOW the released one, or a consumer
      # configured with both feeds silently gets a preview instead of the release.
      #
      # It did. nuget.org carried 0.1.0-rc1 while this pushed 1.0.0-preview10193, and 1.0.0
      # is the higher version whatever the label says - so adding the GitHub feed to a project
      # quietly downgraded it onto an unreleased build.
      #
      # Two rules keep that from recurring:
      #
      #   1. The prefix tracks the release line, not 1.0.0. Under the same prefix, "preview"
      #      sorts below "rc" and below a stable release, so previews stay underneath.
      #      RELEASE_LINE must be bumped when a release line opens - which release.yaml's
      #      package-count check is the precedent for: a number someone has to change is what
      #      makes it a deliberate edit rather than a silent one.
      #
      #   2. Zero-padded to a fixed width. NuGet compares alphanumeric prerelease labels
      #      lexically, so preview9999 sorts above preview10000. The old scheme dodged this by
      #      starting the counter above 9999; padding fixes it rather than deferring it to
      #      run 100000.
      - name: Pack
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          # The open line, which is the one previews belong under - not the last one released.
          # The line has released through v0.33.0-rc1000; there was no 0.7.0, and 0.23.0 through
          # 0.29.0 were skipped so the consolidation got a number of its own.
          #
          # This sat at 0.23.0 for the whole of v0.30.0-rc1000, so every preview that release
          # opened was stamped below it and the feed had nothing that could supersede the release.
          # It now moves in the same pull request as the tag it opens the line after.
          RELEASE_LINE: 0.34.0
        run: |
          BUILD=$(printf '%06d' "$GITHUB_RUN_NUMBER")
          echo "Packing $RELEASE_LINE-preview$BUILD"
          dotnet pack Hardened.slnx --configuration Release --no-build /p:PackageVersion=$RELEASE_LINE-preview$BUILD

      # Packing the solution takes whatever is not marked IsPackable=false, which is how
      # Hardened.IntegrationTests.Console.SUT and .OpenApi.SUT reached the feed as packages -
      # a public ID claimed by a test fixture, and on nuget.org that would be permanent.
      # IsPackable=false was added to those projects; this is what notices the next one.
      #
      # find rather than src/**/bin, which without shopt -s globstar is one directory level and
      # matched nothing here even before src/Clouds/Aws put the AWS packages three levels down.
      - name: Verify no test fixture was packed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          LEAKED=$(find src -path '*/bin/Release/*.nupkg' \
            | xargs -n1 basename \
            | grep -Ei '^(Hardened\.IntegrationTests|.*\.Tests\.)' || true)

          if [ -n "$LEAKED" ]; then
            echo "::error::Test fixtures were packed. Mark them IsPackable=false."
            echo "$LEAKED"
            exit 1
          fi

      # Same reason as above: the glob has to reach src/Clouds/Aws/Lambda/<area>/<project>/bin.
      - name: Push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          find src -path '*/bin/Release/*.nupkg' -print0 | xargs -0 -n1 \
            dotnet nuget push --api-key ${{secrets.GITHUB_TOKEN}} \
              --source "https://nuget.pkg.github.com/ipjohnson/index.json" --skip-duplicate
