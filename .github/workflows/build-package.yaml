name: build-package

# Publishing is restricted to main. Previously this workflow ran on `[push]` with no
# branch filter, so every push to any branch packed and pushed packages to the feed.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # No source-url, and no NUGET_AUTH_TOKEN. Restore reads src/nuget.config, which is nuget.org
      # and nothing else since ValidationModules was published there at 0.1.0-alpha.1.
      #
      # It used to point setup-dotnet at GitHub Packages, which writes a nuget.config whose
      # credential is the literal string %NUGET_AUTH_TOKEN% - expanded by NuGet when it restores,
      # not when the config is written. The variable therefore had to still be set at restore time,
      # and an authenticated source that answers 401 is fatal to the whole restore rather than to
      # the packages it serves. Neither hazard is worth carrying for a feed nothing needs.
      #
      # The push step below is unaffected: it names its feed and key on the command line.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - run: dotnet restore src/Hardened.Framework.sln

      # ContinuousIntegrationBuild turns warnings into errors (see src/Directory.Build.props).
      # The solution builds warning-free; this is what stops that drifting back.
      - run: dotnet build src/Hardened.Framework.sln --no-restore --configuration Release -p:ContinuousIntegrationBuild=true

      - name: Test with coverage
        run: |
          set -o pipefail
          dotnet test src/Hardened.Framework.sln \
            --no-build --configuration Release \
            --settings coverlet.runsettings \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage \
            | tee test-output.log

      # xUnit drops test cases that share a unique ID, reporting it only as an
      # informational line. A green run can therefore hide tests that never executed.
      # Treat any such message as a build failure.
      - name: Fail if any test was silently skipped
        run: |
          if grep -q "duplicate ID" test-output.log; then
            echo "::error::Test cases were silently skipped due to duplicate test-case IDs. Give the colliding test methods distinct names."
            grep "duplicate ID" test-output.log
            exit 1
          fi
          echo "No silently skipped tests."

      # The check above catches tests that vanish by accident. This one catches
      # tests that vanish on purpose: a Skip is a test the suite is not running,
      # and once it is green nothing distinguishes it from one that passed.
      #
      # Skipping is still the right answer locally, for a machine missing
      # something the suite needs. It is not an answer on a runner, where
      # everything is present and a skip means a requirement went missing.
      #
      # A repro pinned to a defect belongs in the same change as the fix, so it
      # runs. If a test genuinely cannot run here, delete it and open an issue -
      # a permanent Skip is a comment that costs a test run.
      - name: Fail if any test skipped
        run: |
          if grep -Eq "Skipped:[[:space:]]*[1-9]" test-output.log; then
            echo "::error::Tests skipped in CI. A skipped test is one the suite is not running - land the repro with its fix, or remove it."
            grep -E "Skipped:[[:space:]]*[1-9]" test-output.log
            exit 1
          fi
          echo "Every test ran."

      - name: Coverage summary
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:"coverage/**/*.cobertura.xml" \
            -targetdir:coverage-report \
            -reporttypes:"TextSummary;MarkdownSummaryGithub;Html;JsonSummary"
          cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          cat coverage-report/Summary.txt

      # Coverage was measured and printed on every build and enforced nothing, so it could fall to
      # zero and stay green. This gate holds each assembly at the coverage it already had.
      # Raising a floor is a deliberate act: scripts/coverage-gate.py --update, reviewed and committed.
      - name: Coverage gate
        run: python3 scripts/coverage-gate.py --summary coverage-report/Summary.json

      # always(), because the report is most wanted exactly when the gate rejected the run - and
      # the gate is the step before this one, so a failure used to mean no artifact to look at.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage-report

      # The continuous feed's version has to sort BELOW the released one, or a consumer
      # configured with both feeds silently gets a preview instead of the release.
      #
      # It did. nuget.org carried 0.1.0-rc1 while this pushed 1.0.0-preview10193, and 1.0.0
      # is the higher version whatever the label says - so adding the GitHub feed to a project
      # quietly downgraded it onto an unreleased build.
      #
      # Two rules keep that from recurring:
      #
      #   1. The prefix tracks the release line, not 1.0.0. Under the same prefix, "preview"
      #      sorts below "rc" and below a stable release, so previews stay underneath.
      #      RELEASE_LINE must be bumped when a release line opens - which release.yaml's
      #      package-count check is the precedent for: a number someone has to change is what
      #      makes it a deliberate edit rather than a silent one.
      #
      #   2. Zero-padded to a fixed width. NuGet compares alphanumeric prerelease labels
      #      lexically, so preview9999 sorts above preview10000. The old scheme dodged this by
      #      starting the counter above 9999; padding fixes it rather than deferring it to
      #      run 100000.
      - name: Pack
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RELEASE_LINE: 0.1.0
        run: |
          BUILD=$(printf '%06d' "$GITHUB_RUN_NUMBER")
          echo "Packing $RELEASE_LINE-preview$BUILD"
          dotnet pack src/Hardened.Framework.sln --configuration Release --no-build /p:PackageVersion=$RELEASE_LINE-preview$BUILD

      # Packing the solution takes whatever is not marked IsPackable=false, which is how
      # Hardened.IntegrationTests.Console.SUT and .OpenApi.SUT reached the feed as packages -
      # a public ID claimed by a test fixture, and on nuget.org that would be permanent.
      # IsPackable=false was added to those projects; this is what notices the next one.
      - name: Verify no test fixture was packed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          LEAKED=$(ls -1 src/**/bin/Release/*.nupkg 2>/dev/null \
            | xargs -n1 basename \
            | grep -Ei '^(Hardened\.IntegrationTests|.*\.Tests\.)' || true)

          if [ -n "$LEAKED" ]; then
            echo "::error::Test fixtures were packed. Mark them IsPackable=false."
            echo "$LEAKED"
            exit 1
          fi

      - name: Push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: dotnet nuget push src/**/bin/Release/*.nupkg --api-key ${{secrets.GITHUB_TOKEN}} --source "https://nuget.pkg.github.com/ipjohnson/index.json" --skip-duplicate
